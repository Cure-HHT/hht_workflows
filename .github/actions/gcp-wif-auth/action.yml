name: GCP WIF auth (org-standard)
description: >
  Authenticates the current workflow job to GCP via Workload Identity
  Federation by impersonating the requested service account. Wraps
  google-github-actions/auth@v3 with the Cure-HHT defaults so callers
  cannot accidentally use long-lived JSON keys. Pin this action by SHA
  from consumer workflows; never by branch or tag.

inputs:
  workload_identity_provider:
    description: >
      Full resource name of the WIF provider, e.g.
      projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<provider>.
      Pass the value from the relevant Terraform output; do NOT hardcode.
    required: true
  service_account:
    description: >
      Email of the GCP service account to impersonate. The WIF binding in
      hht_admin/terraform must permit the caller's repository to impersonate
      this SA (per attribute.repository condition).
    required: true
  token_format:
    description: >
      'access_token' (default) or 'id_token'. Use 'id_token' when the
      consumer needs to authenticate to a Cloud Run service or similar.
    required: false
    default: 'access_token'
  audience:
    description: >
      Optional OIDC audience override. Defaults to the WIF provider's
      expected audience; set only when the target service requires a custom
      one (e.g., authenticating to a specific Cloud Run service URL).
    required: false
    default: ''
  access_token_scopes:
    description: >
      Comma-separated OAuth scopes for the minted access token. Set only when
      the caller needs a scope the default does not cover -- the Play Developer
      API (https://www.googleapis.com/auth/androidpublisher) is the case this
      exists for. Leaving it empty keeps google-github-actions/auth's own
      default, which is cloud-platform.
    required: false
    default: ''

outputs:
  access_token:
    description: >
      The minted access token when token_format == 'access_token'.
      Forwarded from google-github-actions/auth@v3's access_token output.
    value: ${{ steps.gcp.outputs.access_token }}
  id_token:
    description: >
      The minted ID token when token_format == 'id_token'.
    value: ${{ steps.gcp.outputs.id_token }}
  credentials_file_path:
    description: >
      Where the credentials file actually is, AFTER this action moves it out of
      the workspace. Deliberately not a passthrough of the upstream action's
      output of the same name: that one names the workspace path this action has
      just emptied, so forwarding it would hand callers a path to a file that is
      not there.
    value: ${{ steps.relocate.outputs.credentials_file_path }}

runs:
  using: composite
  steps:
    # Implements: HHT-OPS-identity-over-keys/A
    #   Cloud authentication via WIF; no SA JSON keys anywhere.
    - name: Authenticate to Google Cloud
      id: gcp
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}
        token_format: ${{ inputs.token_format }}
        audience: ${{ inputs.audience }}
        access_token_scopes: ${{ inputs.access_token_scopes }}
        create_credentials_file: true
        # Exports GOOGLE_APPLICATION_CREDENTIALS, GOOGLE_GHA_CREDS_PATH and
        # CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE. The next step rewrites all
        # three; turning this off would strand the credential.
        export_environment_variables: true

    # The credentials file must not stay in the workspace.
    #
    # This action writes `gha-creds-<random>.json` into $GITHUB_WORKSPACE and
    # offers no input to move it: the path is built from that variable, and
    # `credentials_file_path` is an output rather than an input. The file is
    # untracked, no .gitignore in this organisation names `gha-creds`, and the
    # action's post step removes it only at the end of the job.
    #
    # A step's output is defined as everything git reports as untracked or
    # ignored, on purpose: no list decides what counts, so the file nobody
    # thought to list is captured too. A credential in the workspace would be
    # captured and published by construction.
    #
    # The alternative -- teaching every capture to skip `gha-creds-*.json` --
    # reinstates the maintained list that arrangement exists to remove, and its
    # omissions would disclose a credential rather than merely lose a file. So
    # the credential moves instead.
    - name: Move the credential out of the workspace
      id: relocate
      shell: bash
      run: ${{ github.action_path }}/relocate-credential.sh

    - name: Refuse if a credential reached the workspace
      shell: bash
      run: ${{ github.action_path }}/no-credential-in-workspace.sh
