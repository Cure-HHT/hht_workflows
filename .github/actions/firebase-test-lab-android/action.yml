name: Firebase Test Lab Android run (org-standard)
description: >
  Runs an Android instrumentation matrix on Firebase Test Lab. Sets up the
  gcloud SDK (GCP WIF auth must already have happened, e.g. via the
  gcp-wif-auth action), verifies the active identity and project, captures
  the Test Lab device catalog as evidence, executes the matrix via the
  bundled run-android-test-lab.sh, downloads the raw result tree into the
  evidence dir when a results bucket is configured, and appends a job-summary
  table. This action NEVER fails the job on a matrix failure: the matrix exit
  code is exposed as the exit_code output so callers can upload evidence
  artifacts first and enforce the result last. Pin this action by SHA from
  consumer workflows; never by branch or tag.

inputs:
  gcp_project_id:
    description: GCP project hosting Firebase Test Lab (e.g. cure-hht-qa).
    required: true
  flavor:
    description: Application flavor label used in the matrix label and summary.
    required: true
  timeout:
    description: Per-device Test Lab timeout (gcloud duration, e.g. 30m).
    required: false
    default: '30m'
  app_apk:
    description: Path to the application APK, relative to working_directory.
    required: true
  test_apk:
    description: Path to the instrumentation APK, relative to working_directory.
    required: true
  results_dir:
    description: Cloud Storage results directory for this run (unique per run/attempt).
    required: true
  results_bucket:
    description: Optional Cloud Storage results bucket. Blank uses the Test Lab default (and skips the raw-result download).
    required: false
    default: ''
  devices:
    description: >
      Optional device specs, one per line
      (model=...,version=...,locale=...,orientation=...). Blank uses the
      script's default coverage matrix.
    required: false
    default: ''
  devices_exclude:
    description: Optional model IDs to exclude from the default matrix, space or newline separated. Ignored when devices is set.
    required: false
    default: ''
  use_orchestrator:
    description: Use Android Test Orchestrator ('true'/'false').
    required: false
    default: 'false'
  flaky_test_attempts:
    description: Extra re-run attempts for failed test cases (gcloud --num-flaky-test-attempts).
    required: false
    default: '1'
  evidence_dir:
    description: Directory (relative to working_directory) receiving command.txt, gcloud-output.log, exit-code.txt, catalog inventory, raw results, and execution-summary.json.
    required: true
  working_directory:
    description: Directory the run executes from (APK and evidence paths are relative to it).
    required: false
    default: '.'
  test_target:
    description: Display-only test target string for the job summary.
    required: false
    default: ''

outputs:
  exit_code:
    description: >
      gcloud firebase test exit code: 0 pass, 10 test failures, 15
      infrastructure/inconclusive, 19 canceled. Callers MUST enforce this
      after uploading evidence (the action itself never fails the job on a
      matrix result).
    value: ${{ steps.run.outputs.exit_code }}

runs:
  using: composite
  steps:
    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1
      with:
        project_id: ${{ inputs.gcp_project_id }}

    - name: Verify Test Lab identity and inventory
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        GCP_PROJECT_ID: ${{ inputs.gcp_project_id }}
        EVIDENCE_DIR: ${{ inputs.evidence_dir }}
      run: |
        set -euo pipefail
        unset CLOUDSDK_CORE_PROJECT  # prevent CLOUDSDK_CORE_PROJECT env override from auth step
        mkdir -p "$EVIDENCE_DIR"
        gcloud config set project "$GCP_PROJECT_ID"
        ACTIVE_PROJECT="$(gcloud config get-value project 2>/dev/null)"
        ACTIVE_ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n 1)"
        test "$ACTIVE_PROJECT" = "$GCP_PROJECT_ID"
        test -n "$ACTIVE_ACCOUNT"
        echo "Authenticated principal: $ACTIVE_ACCOUNT"
        echo "Firebase Test Lab project: $ACTIVE_PROJECT"
        gcloud firebase test android models list --format=json \
          > "$EVIDENCE_DIR/models.json"
        gcloud firebase test android versions list --format=json \
          > "$EVIDENCE_DIR/versions.json"

    # The matrix result is captured, not enforced: evidence upload and the
    # summary must run before the caller fails the job on exit_code.
    - name: Run Android Firebase Test Lab matrix
      id: run
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        GCP_PROJECT_ID: ${{ inputs.gcp_project_id }}
        FLAVOR: ${{ inputs.flavor }}
        TEST_TIMEOUT: ${{ inputs.timeout }}
        ANDROID_DEVICES: ${{ inputs.devices }}
        ANDROID_DEVICES_EXCLUDE: ${{ inputs.devices_exclude }}
        USE_ORCHESTRATOR: ${{ inputs.use_orchestrator }}
        FLAKY_TEST_ATTEMPTS: ${{ inputs.flaky_test_attempts }}
        FIREBASE_RESULTS_BUCKET: ${{ inputs.results_bucket }}
        APP_APK: ${{ inputs.app_apk }}
        TEST_APK: ${{ inputs.test_apk }}
        RESULTS_DIR: ${{ inputs.results_dir }}
        EVIDENCE_DIR: ${{ inputs.evidence_dir }}
      run: |
        set +e
        bash "$GITHUB_ACTION_PATH/run-android-test-lab.sh"
        status=$?
        set -e
        echo "exit_code=$status" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Write Android summary
      shell: bash
      env:
        EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        GCP_PROJECT_ID: ${{ inputs.gcp_project_id }}
        FLAVOR: ${{ inputs.flavor }}
        TEST_TARGET: ${{ inputs.test_target }}
      run: |
        case "${EXIT_CODE:-missing}" in
          0) RESULT="Passed" ;;
          10) RESULT="Test cases failed" ;;
          15) RESULT="Indeterminate / infrastructure error" ;;
          19) RESULT="Canceled" ;;
          missing|'') RESULT="Did not execute" ;;
          *) RESULT="Failed (gcloud exit ${EXIT_CODE})" ;;
        esac
        {
          echo "### Android Firebase Test Lab"
          echo ""
          echo "| Field | Value |"
          echo "|---|---|"
          echo "| Project | \`$GCP_PROJECT_ID\` |"
          echo "| Flavor | \`$FLAVOR\` |"
          echo "| Test target | \`${TEST_TARGET:-n/a}\` |"
          echo "| Result | **$RESULT** |"
          echo "| gcloud exit code | \`${EXIT_CODE:-n/a}\` |"
          echo "| Commit | \`${GITHUB_SHA::7}\` |"
          echo "| Firebase console | https://console.firebase.google.com/project/$GCP_PROJECT_ID/testlab |"
        } >> "$GITHUB_STEP_SUMMARY"
