# hht_workflows/.github/actions/cloud-run-deploy-no-traffic/action.yml
name: Cloud Run deploy (no traffic, tagged)
description: >
  Deploys a Cloud Run (v1) service revision with no traffic and a tag, and
  outputs its name and tagged URL for verification before promotion. Changes
  only the image and the revision's environment variables; see README.md.

inputs:
  service:         { description: "Cloud Run service name", required: true }
  region:          { description: "GCP region", required: true }
  project:         { description: "Deploy project id", required: true }
  image:           { description: "Immutable image digest reference", required: true }
  tag:             { description: "Revision tag for the candidate", required: false, default: "candidate" }
  update_env_vars: { description: "Comma-list for --update-env-vars (may contain a secret; never echoed)", required: true }
  remove_env_vars: { description: "Comma-list of env var NAMES to remove", required: false, default: "" }

outputs:
  tagged_url:
    description: "URL of the candidate-tagged, zero-traffic revision"
    value: ${{ steps.deploy.outputs.tagged_url }}
  revision_name:
    description: "Name of the newly created revision"
    value: ${{ steps.deploy.outputs.revision_name }}

runs:
  using: composite
  steps:
    # Implements: DIARY-OPS-deploy-traffic-gating/A
    - name: Deploy revision with no traffic and a tag
      id: deploy
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        REGION: ${{ inputs.region }}
        PROJECT: ${{ inputs.project }}
        IMAGE: ${{ inputs.image }}
        TAG: ${{ inputs.tag }}
        UPDATE_ENV_VARS: ${{ inputs.update_env_vars }}
        REMOVE_ENV_VARS: ${{ inputs.remove_env_vars }}
      run: |
        set -euo pipefail
        # Do NOT echo $UPDATE_ENV_VARS: on the legacy path it can carry a secret.
        REMOVE_FLAG=()
        if [ -n "$REMOVE_ENV_VARS" ]; then
          REMOVE_FLAG=(--remove-env-vars="$REMOVE_ENV_VARS")
        fi
        # The tag is a separate call: --tag on services update writes a fixed
        # revision name into the service template, which the declaration would
        # see as drift.
        echo "Deploying $SERVICE to $PROJECT with --no-traffic"
        CREATED=$(gcloud run services update "$SERVICE" \
          --region="$REGION" \
          --project="$PROJECT" \
          --image="$IMAGE" \
          --no-traffic \
          --update-env-vars="$UPDATE_ENV_VARS" "${REMOVE_FLAG[@]}" \
          --format='value(status.latestCreatedRevisionName)')
        TAGGED_URL=$(gcloud run services update-traffic "$SERVICE" \
          --region="$REGION" \
          --project="$PROJECT" \
          --update-tags="$TAG=${CREATED:?the update reported no created revision}" \
          --format=json \
          | jq -r --arg r "$CREATED" --arg t "$TAG" \
            'first(.[] | select(.revisionName == $r) | .tags[]
              | select(.tag == $t) | .url | strings | select(. != ""))')
        if [ -z "$TAGGED_URL" ]; then
          echo "::error::No URL for tag '$TAG' on created revision $CREATED."
          exit 1
        fi
        echo "Candidate revision: $CREATED"
        echo "Candidate URL:      $TAGGED_URL"
        {
          echo "revision_name=$CREATED"
          echo "tagged_url=$TAGGED_URL"
        } >> "$GITHUB_OUTPUT"
