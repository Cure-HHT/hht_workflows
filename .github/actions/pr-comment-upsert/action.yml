name: Upsert PR comment by marker
description: >
  Find the PR comment whose body starts with a unique HTML-comment marker
  and update it in place; create a fresh one when no match exists; collapse
  any duplicates. Use this instead of github-script createComment when a
  check posts on every run -- a single rolling comment is more readable
  than an accumulating history, and the run logs are the audit trail.

inputs:
  marker:
    description: >
      Hidden HTML-comment that uniquely identifies this check's comment.
      Convention: `<!-- pr-comment-upsert:<kebab-id> -->` where `<kebab-id>`
      names the check posting it (e.g. `manifest-staleness`,
      `terraform-plan`, `pr-health`). The marker MUST be stable across runs
      of the same check; changing it orphans prior comments and breaks
      upsert semantics. The marker MUST be the first line of the body.
    required: true
  body:
    description: >
      Full comment body, starting with the marker on its own first line.
      The action validates this so a typo in the caller does not silently
      degrade to "always append a new comment". Multi-line content,
      markdown, and code fences are supported (passed through verbatim).
      GitHub limits comment bodies to 65536 chars; the action warns at
      50k and errors at 65k.
    required: true
  pr_number:
    description: >
      Pull request number to comment on. Defaults to
      github.event.pull_request.number. Override only when invoking from
      a non-pull_request event that targets a specific PR.
    required: false
    default: ${{ github.event.pull_request.number }}
  github_token:
    description: >
      Token with `pull-requests: write` permission. Defaults to the
      automatic `github.token` which is sufficient for same-repo PRs.
      For cross-repo invocation, pass a GitHub App token.
    required: false
    default: ${{ github.token }}

outputs:
  comment_id:
    description: >
      Numeric ID of the resulting comment (whether updated or created).
      Useful for follow-up steps that want to react in the same thread.
    value: ${{ steps.upsert.outputs.comment_id }}
  action:
    description: >
      `updated`, `created`, or `noop`. `noop` means a duplicate was
      found and removed but no PATCH was needed (rare).
    value: ${{ steps.upsert.outputs.action }}

runs:
  using: composite
  steps:
    - id: upsert
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        PR: ${{ inputs.pr_number }}
        MARKER: ${{ inputs.marker }}
        BODY: ${{ inputs.body }}
      run: |
        set -euo pipefail

        if [ -z "${PR:-}" ]; then
          echo "ERROR: pr_number is empty. Pass inputs.pr_number explicitly when invoking outside a pull_request event." >&2
          exit 2
        fi

        case "$MARKER" in
          "<!--"*"-->") ;;
          *)
            echo "ERROR: marker must be an HTML comment of the form '<!-- ... -->' (got: ${MARKER:0:40}...)" >&2
            exit 2
            ;;
        esac

        case "$BODY" in
          "${MARKER}"*) ;;
          *)
            echo "ERROR: body must START with the marker on its own first line." >&2
            echo "       marker:         $MARKER" >&2
            echo "       body[0:200]:    ${BODY:0:200}" >&2
            exit 2
            ;;
        esac

        BODY_LEN=${#BODY}
        if [ "$BODY_LEN" -ge 65536 ]; then
          echo "ERROR: body length ${BODY_LEN} exceeds GitHub's 65536-char comment limit. Truncate before calling." >&2
          exit 2
        fi
        if [ "$BODY_LEN" -ge 50000 ]; then
          echo "::warning::Comment body is ${BODY_LEN} chars; approaching GitHub's 65536 limit. Consider truncating diff/log content."
        fi

        # The jq filter uses --arg so the marker is passed as data, not
        # interpolated into the jq program -- defends against markers with
        # quotes, backslashes, or shell metacharacters.
        MATCH_IDS=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
          --jq --arg m "$MARKER" '.[] | select(.body | startswith($m)) | .id')

        FIRST_ID=""
        DUP_COUNT=0
        for id in $MATCH_IDS; do
          if [ -z "$FIRST_ID" ]; then
            FIRST_ID="$id"
          else
            echo "Deleting duplicate comment $id"
            gh api -X DELETE "repos/${REPO}/issues/comments/${id}" >/dev/null
            DUP_COUNT=$((DUP_COUNT + 1))
          fi
        done

        BODY_FILE=$(mktemp)
        trap 'rm -f "$BODY_FILE"' EXIT
        printf '%s' "$BODY" > "$BODY_FILE"

        if [ -n "$FIRST_ID" ]; then
          gh api -X PATCH "repos/${REPO}/issues/comments/${FIRST_ID}" \
            -F "body=@${BODY_FILE}" >/dev/null
          echo "comment_id=${FIRST_ID}" >> "$GITHUB_OUTPUT"
          echo "action=updated" >> "$GITHUB_OUTPUT"
          echo "Updated comment ${FIRST_ID} (collapsed ${DUP_COUNT} duplicates)"
        else
          RESP=$(gh api -X POST "repos/${REPO}/issues/${PR}/comments" \
            -F "body=@${BODY_FILE}")
          NEW_ID=$(echo "$RESP" | jq -r .id)
          echo "comment_id=${NEW_ID}" >> "$GITHUB_OUTPUT"
          echo "action=created" >> "$GITHUB_OUTPUT"
          echo "Created comment ${NEW_ID}"
        fi
