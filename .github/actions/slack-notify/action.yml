name: Slack notify (route by event/env, post via bot token)
description: >
  Looks up a routing key (event[, env]) in the caller's slack-channels.yml,
  resolves channel name(s) -> channel ID(s) via Slack conversations.list,
  self-joins each public channel (idempotent), and posts a chat.postMessage
  to each. Supports single-channel or multi-channel fan-out (leaf may be a
  string or a list). Designed to be called from any Cure-HHT repo whose
  workflow has already done actions/checkout (so slack-channels.yml is on
  disk).

  When `bookmark-title` is provided, the action also maintains a single
  channel bookmark with that exact title pointing at the just-posted
  message's permalink: it edits the existing bookmark if one with that
  title already exists in the channel, otherwise it adds a new one.
  Bookmarks appear as full-row entries under the channel's Bookmarks
  tab (alongside Messages / Files / Pins), so descriptive titles read
  better than terse slot-style names. This replaces the older "pin the
  deploy message" approach (which Slack's pinned_item rendering made
  visually noisy for Block Kit messages).

  When `dm-user-email` is provided, the action additionally resolves the
  Slack user via users.lookupByEmail and sends the same text/blocks as a
  direct message after the channel posts. DM delivery is best-effort:
  lookup or DM failures are soft (::warning::, `dm-status: soft-failed`)
  because the routed channels have already received the message.

  When `dm-only` is "true", the action skips channel resolution and channel
  posting entirely (no conversations.list, no channel chat.postMessage) and
  sends ONLY the DM. `dm-user-email` is then required — dm-only with nobody
  to DM is a misconfiguration and hard-fails. `event`/`env` are ignored in
  dm-only mode. The DM's soft-fail semantics are unchanged, but because no
  channel received the message the warning says so explicitly.

  Required Slack bot scopes on the supplied token:
    - chat:write
    - channels:read    (conversations.list)
    - channels:join    (conversations.join — public channel self-heal)
    - groups:read      (only if any routed channel is private)
    - bookmarks:read   (only when bookmark-title is set — bookmarks.list)
    - bookmarks:write  (only when bookmark-title is set — bookmarks.add/edit)
    - users:read.email (only when dm-user-email is set — users.lookupByEmail)
    - im:write         (only when dm-user-email is set — open the DM conversation)

inputs:
  event:
    description: >
      Top-level routing key (e.g. deploy-success, deploy-failure,
      android-build-success, maintenance-overdue). Looked up in the
      routing-file's `routing` map. Required in channel mode; the script
      hard-fails with a clear ::error:: if it is empty and dm-only is not
      "true". In dm-only mode `event`/`env` are ignored and may be omitted
      (no routing lookup happens), so this input is declared optional to let
      dm-only callers leave it out.
    required: false
    default: ""
  env:
    description: >
      Optional sub-key for per-environment routing (e.g. dev, qa, uat,
      prod). When provided, the lookup is routing.<event>.<env>; when
      omitted, the lookup is routing.<event> (flat).
    required: false
    default: ""
  text:
    description: >
      Slack mrkdwn message body. Caller composes mention prefix.
      Always sent — when `blocks` is also provided, this becomes the
      notification fallback / accessibility text per Slack's
      recommended pattern, while `blocks` controls in-channel rendering.
    required: true
  blocks:
    description: >
      Optional Slack Block Kit `blocks` payload as a JSON-encoded
      string (e.g. `'[{"type":"section","text":{"type":"mrkdwn","text":"hi"}}]'`).
      When provided, the post uses this for in-channel rendering and
      keeps `text` as the notification fallback. Use this for
      structured content (Block Kit table, rich_text, dividers, etc.)
      where mrkdwn alone is too limited.
    required: false
    default: ""
  bookmark-title:
    description: >
      When non-empty, maintain a channel bookmark with this exact title
      pointing at the just-posted message's permalink. Find-by-title is
      the dedup key: if a bookmark with this title already exists in the
      channel it is edited (link updated), otherwise it is added.
      Bookmarks render as full-row entries inside the channel's
      Bookmarks tab, so descriptive titles read well — e.g.
      "Cloud Run live versions (callisto / DEV)" rather than a terse
      slot key. The title is the dedup key, so it must be stable across
      runs for the same slot. Bookmark errors are soft-failed
      (::warning::) so a Slack-side hiccup never turns a successful
      deploy red; the `bookmark-status` output reports the per-channel
      outcome. Requires `bookmarks:read` + `bookmarks:write` on the bot
      token.

      Note: two concurrent runs that race on the same title will both
      bookmarks.edit the same entry — last writer wins. chat.postMessage
      itself is already serialized through Slack, so the "last writer"
      is the deploy whose post Slack accepted last.
    required: false
    default: ""
  slack-token:
    description: Slack bot OAuth token (xoxb-...).
    required: true
  routing-file:
    description: Path to routing YAML, relative to caller's workspace.
    required: false
    default: .github/slack-channels.yml
  dm-user-email:
    description: >
      Optional email address of a Slack workspace user who should also
      receive the message as a direct message, after the normal channel
      routing/posting. The user is resolved via users.lookupByEmail and
      the same text/blocks are sent via chat.postMessage to the user ID.
      Lookup or DM failures are soft (::warning::, action stays green,
      `dm-status: soft-failed`) — the routed channels already got the
      message, so a DM-side hiccup must not paint the run red. Requires
      `users:read.email` + `im:write` on the bot token. Empty (default)
      disables the DM entirely.
    required: false
    default: ""
  dm-only:
    description: >
      When "true", skip channel resolution and channel posting entirely and
      send ONLY the direct message to `dm-user-email` (which then becomes
      required — an empty value is a hard error, since dm-only with nobody to
      DM would notify no one). `event`/`env` are ignored in this mode. The
      DM's soft-fail semantics are unchanged (::warning::, `dm-status:
      soft-failed`), but the warning states that no channel received the
      message, because in dm-only mode none did. Default "false" preserves the
      normal channel-post (then optional DM) behavior byte-for-byte.
    required: false
    default: "false"
  thread-reply-text:
    description: >
      Optional mrkdwn body posted as a thread reply on the main message,
      to each channel that received it. Empty (default) disables thread-reply.
      Used to keep the in-channel message terse while preserving longer
      supplementary content (e.g. the deterministic release-notes block)
      in the thread.
    required: false
    default: ""

outputs:
  channel-ids:
    description: Comma-separated list of channel IDs the message was posted to.
    value: ${{ steps.post.outputs.channel-ids }}
  message-tss:
    description: >
      Comma-separated chat.postMessage `ts` values, in the same order as
      `channel-ids`. Useful for follow-up Slack API calls (threading,
      reactions, etc.).
    value: ${{ steps.post.outputs.message-tss }}
  bookmark-status:
    description: >
      Comma-separated per-channel bookmark outcome, aligned with
      `channel-ids`. One of `bookmarked` (a bookmark with the given
      title now points at the new message — either freshly added or
      edited from a prior entry), `skipped` (no bookmark-title given),
      or `soft-failed` (any of chat.getPermalink / bookmarks.list /
      bookmarks.add / bookmarks.edit returned an error; the deploy
      stays green and the channel's bookmark may still reference the
      prior message).
    value: ${{ steps.post.outputs.bookmark-status }}
  dm-status:
    description: >
      Outcome of the optional `dm-user-email` copy. One of `sent` (user
      resolved and DM delivered), `skipped` (no dm-user-email given), or
      `soft-failed` (users.lookupByEmail or the DM chat.postMessage
      errored; a ::warning:: was emitted and the action stayed green —
      the routed channels already received the message).
    value: ${{ steps.dm.outputs.dm-status }}

runs:
  using: composite
  steps:
    - name: Resolve route, self-join, and post
      id: post
      shell: bash
      env:
        EVENT: ${{ inputs.event }}
        ENV_KEY: ${{ inputs.env }}
        TEXT: ${{ inputs.text }}
        BLOCKS: ${{ inputs.blocks }}
        BOOKMARK_TITLE: ${{ inputs.bookmark-title }}
        SLACK_TOKEN: ${{ inputs.slack-token }}
        ROUTING_FILE: ${{ inputs.routing-file }}
        DM_ONLY: ${{ inputs.dm-only }}
      run: |
        set -euo pipefail

        # http_call NAME [curl args...]
        # curl without -f: transport rc and HTTP status are captured and decided
        # on explicitly, so every failure tier prints a named diagnostic instead
        # of killing the step with a bare exit code. The response body lands in
        # "$HTTP_BODY_FILE" for the caller to read; Slack's Web API normally
        # returns HTTP 200 even for API-level errors (ok: false), so most calls
        # never hit the >=400 branch here -- that check exists for the
        # transport-adjacent failures (auth edge cases, rate-limit gateways)
        # that do surface as a real HTTP status.
        HTTP_BODY_FILE="$(mktemp)"
        http_call() {
          local name="$1"; shift
          local rc=0 status
          status="$(curl -sS -o "$HTTP_BODY_FILE" -w '%{http_code}' "$@")" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::${name} got no HTTP response (curl exit ${rc}: DNS/TLS/timeout/connection). Check runner network and the endpoint's availability."
            exit 1
          fi
          if [ "$status" -ge 400 ]; then
            echo "::error::${name} failed with HTTP ${status}. Response: $(cat "$HTTP_BODY_FILE")"
            exit 1
          fi
        }

        # dm-only mode: no channel work at all. Emit empty channel outputs so
        # downstream consumers (thread-reply, the caller's status step) see
        # "no channel posted", and let the DM step below do the delivery.
        if [ "$DM_ONLY" = "true" ]; then
          echo "dm-only mode: skipping channel resolution and posting; DM only."
          echo "channel-ids=" >> "$GITHUB_OUTPUT"
          echo "message-tss=" >> "$GITHUB_OUTPUT"
          echo "bookmark-status=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Channel mode requires a routing key. `event` is declared optional on
        # the action so dm-only callers can omit it, but a channel post with no
        # event has nothing to look up — fail loudly rather than resolve an
        # empty key. dm-only mode already returned above, so reaching here means
        # channel mode.
        if [ -z "$EVENT" ]; then
          echo "::error::slack-notify: 'event' is required unless dm-only=true. Channel routing has no key to look up without it."
          exit 1
        fi

        if [ ! -f "$ROUTING_FILE" ]; then
          echo "::error::routing-file '$ROUTING_FILE' not found in caller workspace. Did the caller run actions/checkout?"
          exit 1
        fi

        # PyYAML — same pattern as validate-build-paths.yml in the
        # callisto repo. --user bypasses PEP 668's externally-managed
        # marker on ubuntu-latest. yq's runner preinstall is undocumented
        # and image-version-dependent, so we don't depend on it.
        pip install --user --quiet pyyaml

        # 1. Resolve the routing leaf to a list of role keys.
        # The leaf can be a string (single channel) or a list (fan-out).
        # We normalize to a JSON array for the rest of the step.
        ROLE_KEYS_JSON=$(python3 -c '
        import json, sys, yaml
        path, event, env_key = sys.argv[1], sys.argv[2], sys.argv[3]
        with open(path) as f:
            data = yaml.safe_load(f) or {}
        routing = (data.get("routing") or {}).get(event)
        if routing is None:
            print(json.dumps({"error": f"event '\''{event}'\'' not found in routing"}))
            sys.exit(0)
        if env_key:
            if not isinstance(routing, dict):
                print(json.dumps({"error": f"event '\''{event}'\'' is not env-keyed but env='\''{env_key}'\'' was given"}))
                sys.exit(0)
            leaf = routing.get(env_key)
            if leaf is None:
                print(json.dumps({"error": f"no entry for env '\''{env_key}'\'' under event '\''{event}'\''"}))
                sys.exit(0)
        else:
            if isinstance(routing, dict):
                print(json.dumps({"error": f"event '\''{event}'\'' is env-keyed but no env was given"}))
                sys.exit(0)
            leaf = routing
        keys = leaf if isinstance(leaf, list) else [leaf]
        print(json.dumps({"keys": keys}))
        ' "$ROUTING_FILE" "$EVENT" "$ENV_KEY")

        if echo "$ROLE_KEYS_JSON" | jq -e '.error' >/dev/null 2>&1; then
          err=$(echo "$ROLE_KEYS_JSON" | jq -r '.error')
          echo "::error::Routing resolution failed in $ROUTING_FILE: $err"
          exit 1
        fi

        # 2. Resolve each role key to a channel name via the
        # `channels:` map.
        CHANNEL_NAMES_JSON=$(python3 -c '
        import json, sys, yaml
        path, role_keys_json = sys.argv[1], sys.argv[2]
        with open(path) as f:
            data = yaml.safe_load(f) or {}
        channels = data.get("channels") or {}
        keys = json.loads(role_keys_json).get("keys", [])
        out = []
        missing = []
        for k in keys:
            v = channels.get(k)
            if not v:
                missing.append(k)
            else:
                # Strip leading "#" — Slack API matches by bare name.
                out.append(v.lstrip("#"))
        print(json.dumps({"names": out, "missing": missing}))
        ' "$ROUTING_FILE" "$ROLE_KEYS_JSON")

        if [ "$(echo "$CHANNEL_NAMES_JSON" | jq -r '.missing | length')" != "0" ]; then
          missing=$(echo "$CHANNEL_NAMES_JSON" | jq -r '.missing | join(", ")')
          echo "::error::Role key(s) missing from channels map in $ROUTING_FILE: $missing"
          exit 1
        fi

        CHANNEL_NAMES=$(echo "$CHANNEL_NAMES_JSON" | jq -r '.names[]')

        # 3. Bookmark mode is enabled iff the caller passed a non-empty
        # bookmark-title. The title itself is the dedup key — there's no
        # derived slug to compute and no Slack-side metadata to attach.
        if [ -n "$BOOKMARK_TITLE" ]; then
          BOOKMARK_ENABLED=true
        else
          BOOKMARK_ENABLED=false
        fi

        # 4. Resolve channel name -> channel ID via Slack
        # conversations.list. Cache the channel list once per step rather
        # than once per fan-out target (avoids re-paginating). Bot needs
        # channels:read (and groups:read for private channels).
        all_channels_json=$(mktemp)
        echo "[]" > "$all_channels_json"

        cursor=""
        while :; do
          url='https://slack.com/api/conversations.list?limit=200&types=public_channel,private_channel'
          if [ -n "$cursor" ]; then
            url="${url}&cursor=$(printf '%s' "$cursor" | jq -sRr @uri)"
          fi
          http_call "Slack conversations.list" --max-time 15 \
            -H "Authorization: Bearer $SLACK_TOKEN" "$url"
          resp="$(cat "$HTTP_BODY_FILE")"

          # Validate JSON before invoking jq. Transient non-JSON
          # (proxy 502 HTML, empty body, rate-limit page) would
          # otherwise crash with a raw jq parse error rather than a
          # controlled ::error::.
          if ! printf '%s' "$resp" | jq -e . >/dev/null 2>&1; then
            echo "::error::Slack conversations.list returned non-JSON response (transient proxy or empty body?)."
            echo "Response head: $(printf '%s' "$resp" | head -c 200)"
            exit 1
          fi

          if [ "$(echo "$resp" | jq -r '.ok')" != "true" ]; then
            err=$(echo "$resp" | jq -r '.error // "unknown"')
            echo "::error::Slack conversations.list failed: $err. Bot may need 'channels:read' (and 'groups:read' for private channels). Reinstall the app at api.slack.com/apps after adding."
            exit 1
          fi

          # Append this page's channels to the cache.
          jq -s '.[0] + .[1].channels' "$all_channels_json" \
            <(echo "$resp") > "${all_channels_json}.next"
          mv "${all_channels_json}.next" "$all_channels_json"

          cursor=$(echo "$resp" | jq -r '.response_metadata.next_cursor // ""')
          [ -z "$cursor" ] && break
        done

        # 5. For each target channel name, look up its ID, self-join,
        # post, and (when bookmark-title is set) upsert the bookmark.
        posted_ids=()
        posted_tss=()
        posted_bookmark_status=()
        while IFS= read -r name; do
          [ -z "$name" ] && continue
          channel_id=$(jq -r --arg n "$name" \
            '.[] | select(.name == $n) | .id' "$all_channels_json" \
            | head -n1)

          if [ -z "$channel_id" ]; then
            echo "::error::Channel '#$name' not found in any conversations.list page. Renamed/deleted, or bot's app not installed in this workspace?"
            exit 1
          fi

          # Idempotent public-channel self-join. Private channels
          # need a one-time /invite — conversations.join doesn't
          # apply to them. We tolerate "method_not_supported_for_channel_type"
          # so private-channel callers don't fail here.
          http_call "Slack conversations.join for #$name ($channel_id)" --max-time 15 -X POST \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "channel=$channel_id" \
            'https://slack.com/api/conversations.join'
          join_resp="$(cat "$HTTP_BODY_FILE")"

          if ! printf '%s' "$join_resp" | jq -e . >/dev/null 2>&1; then
            echo "::error::Slack conversations.join returned non-JSON response."
            echo "Response head: $(printf '%s' "$join_resp" | head -c 200)"
            exit 1
          fi

          join_ok=$(echo "$join_resp" | jq -r '.ok')
          if [ "$join_ok" != "true" ]; then
            join_err=$(echo "$join_resp" | jq -r '.error // "unknown"')
            case "$join_err" in
              method_not_supported_for_channel_type|already_in_channel)
                : # ok — private channel or already member
                ;;
              *)
                echo "::error::Slack conversations.join failed for #$name ($channel_id): $join_err"
                exit 1
                ;;
            esac
          fi

          # 6. Build and post the message. `text` is always sent;
          # `blocks` is added when provided. Each piece is grafted onto
          # the JSON via jq's `+ {key: val}` so we don't have to juggle
          # nested conditionals in shell. Validate blocks JSON up front
          # so a malformed payload fails the step with a clear error
          # rather than crashing inside jq.
          if [ -n "$BLOCKS" ]; then
            if ! printf '%s' "$BLOCKS" | jq -e 'type == "array"' >/dev/null 2>&1; then
              # Single quotes around 'blocks' rather than backticks — a
              # backtick in a double-quoted bash string is command
              # substitution and would try to execute `blocks`.
              echo "::error::'blocks' input must be a JSON-encoded array (got something else or invalid JSON)."
              echo "First 200 chars: $(printf '%s' "$BLOCKS" | head -c 200)"
              exit 1
            fi
          fi

          payload=$(jq -n \
            --arg ch "$channel_id" \
            --arg txt "$TEXT" \
            '{channel: $ch, text: $txt}')

          if [ -n "$BLOCKS" ]; then
            payload=$(printf '%s' "$payload" \
              | jq --argjson blks "$BLOCKS" '. + {blocks: $blks}')
          fi

          http_call "Slack chat.postMessage for #$name ($channel_id)" --max-time 15 -X POST \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$payload" \
            'https://slack.com/api/chat.postMessage'
          post_resp="$(cat "$HTTP_BODY_FILE")"

          if ! printf '%s' "$post_resp" | jq -e . >/dev/null 2>&1; then
            echo "::error::Slack chat.postMessage returned non-JSON response."
            echo "Response head: $(printf '%s' "$post_resp" | head -c 200)"
            exit 1
          fi

          post_ok=$(echo "$post_resp" | jq -r '.ok')
          if [ "$post_ok" != "true" ]; then
            post_err=$(echo "$post_resp" | jq -r '.error // "unknown"')
            echo "::error::Slack chat.postMessage failed for #$name ($channel_id): $post_err"
            exit 1
          fi

          post_ts=$(echo "$post_resp" | jq -r '.ts')
          echo "Posted to #$name ($channel_id) ts=$post_ts"
          posted_ids+=("$channel_id")
          posted_tss+=("$post_ts")

          # 7. Maintain the bookmark slot. Find-by-title is the dedup
          # key: if a bookmark with $BOOKMARK_TITLE already exists,
          # bookmarks.edit it to point at the new permalink; otherwise
          # bookmarks.add a fresh one. All bookmark failures are soft
          # (::warning::, continue) so a successful deploy never goes
          # red on a Slack-side blip; the per-channel outcome is
          # reported via `bookmark-status`.
          bookmark_outcome="skipped"
          if [ "$BOOKMARK_ENABLED" = "true" ]; then
            bookmark_outcome="bookmarked"

            # 7a. Resolve the new message's permalink. Bookmarks
            # require a URL, not a (channel, ts) pair.
            perm_resp=$(curl -sS --max-time 15 -G \
              -H "Authorization: Bearer $SLACK_TOKEN" \
              --data-urlencode "channel=$channel_id" \
              --data-urlencode "message_ts=$post_ts" \
              'https://slack.com/api/chat.getPermalink') || perm_resp=""

            permalink=""
            if ! printf '%s' "$perm_resp" | jq -e . >/dev/null 2>&1; then
              echo "::warning::Slack chat.getPermalink returned non-JSON response for #$name ($channel_id). Bookmark not updated."
              echo "Response head: $(printf '%s' "$perm_resp" | head -c 200)"
              bookmark_outcome="soft-failed"
            elif [ "$(echo "$perm_resp" | jq -r '.ok')" != "true" ]; then
              perm_err=$(echo "$perm_resp" | jq -r '.error // "unknown"')
              echo "::warning::Slack chat.getPermalink failed for #$name ($channel_id): $perm_err. Bookmark not updated."
              bookmark_outcome="soft-failed"
            else
              permalink=$(echo "$perm_resp" | jq -r '.permalink')
            fi

            # 7b. List bookmarks and find one matching $BOOKMARK_TITLE
            # by exact equality. Slack has no server-side filter, and a
            # channel can hold up to 100 bookmarks — we iterate.
            existing_bm_id=""
            if [ "$bookmark_outcome" = "bookmarked" ]; then
              list_resp=$(curl -sS --max-time 15 -G \
                -H "Authorization: Bearer $SLACK_TOKEN" \
                --data-urlencode "channel_id=$channel_id" \
                'https://slack.com/api/bookmarks.list') || list_resp=""

              if ! printf '%s' "$list_resp" | jq -e . >/dev/null 2>&1; then
                echo "::warning::Slack bookmarks.list returned non-JSON response for #$name ($channel_id). Bookmark not updated."
                bookmark_outcome="soft-failed"
              elif [ "$(echo "$list_resp" | jq -r '.ok')" != "true" ]; then
                list_err=$(echo "$list_resp" | jq -r '.error // "unknown"')
                echo "::warning::Slack bookmarks.list failed for #$name ($channel_id): $list_err. Bot may need 'bookmarks:read' scope. Bookmark not updated."
                bookmark_outcome="soft-failed"
              else
                existing_bm_id=$(echo "$list_resp" | jq -r \
                  --arg t "$BOOKMARK_TITLE" \
                  '[.bookmarks[]? | select(.title == $t)][0].id // ""')
              fi
            fi

            # 7c. Either edit the existing bookmark or add a new one.
            # Both calls go through the same soft-fail funnel.
            if [ "$bookmark_outcome" = "bookmarked" ]; then
              if [ -n "$existing_bm_id" ]; then
                bm_resp=$(curl -sS --max-time 15 -X POST \
                  -H "Authorization: Bearer $SLACK_TOKEN" \
                  -H 'Content-Type: application/x-www-form-urlencoded' \
                  --data-urlencode "channel_id=$channel_id" \
                  --data-urlencode "bookmark_id=$existing_bm_id" \
                  --data-urlencode "link=$permalink" \
                  'https://slack.com/api/bookmarks.edit') || bm_resp=""
                bm_method="bookmarks.edit"
              else
                bm_resp=$(curl -sS --max-time 15 -X POST \
                  -H "Authorization: Bearer $SLACK_TOKEN" \
                  -H 'Content-Type: application/x-www-form-urlencoded' \
                  --data-urlencode "channel_id=$channel_id" \
                  --data-urlencode "title=$BOOKMARK_TITLE" \
                  --data-urlencode "type=link" \
                  --data-urlencode "link=$permalink" \
                  'https://slack.com/api/bookmarks.add') || bm_resp=""
                bm_method="bookmarks.add"
              fi

              if ! printf '%s' "$bm_resp" | jq -e . >/dev/null 2>&1; then
                echo "::warning::Slack $bm_method returned non-JSON response for #$name ($channel_id). Bookmark not updated."
                echo "Response head: $(printf '%s' "$bm_resp" | head -c 200)"
                bookmark_outcome="soft-failed"
              elif [ "$(echo "$bm_resp" | jq -r '.ok')" != "true" ]; then
                bm_err=$(echo "$bm_resp" | jq -r '.error // "unknown"')
                echo "::warning::Slack $bm_method failed for #$name ($channel_id): $bm_err. Bot may need 'bookmarks:write' scope. Bookmark not updated."
                bookmark_outcome="soft-failed"
              else
                echo "Bookmark '$BOOKMARK_TITLE' in #$name -> $permalink ($bm_method)"
              fi
            fi
          fi
          posted_bookmark_status+=("$bookmark_outcome")
        done <<< "$CHANNEL_NAMES"

        # CSV-join outputs. Subshell so the IFS change doesn't leak.
        ( IFS=,; echo "channel-ids=${posted_ids[*]:-}"               >> "$GITHUB_OUTPUT" )
        ( IFS=,; echo "message-tss=${posted_tss[*]:-}"               >> "$GITHUB_OUTPUT" )
        ( IFS=,; echo "bookmark-status=${posted_bookmark_status[*]:-}" >> "$GITHUB_OUTPUT" )

        rm -f "$all_channels_json" "$HTTP_BODY_FILE"

    - name: Post thread reply (deterministic block / supplementary content)
      if: inputs.thread-reply-text != ''
      shell: bash
      env:
        SLACK_TOKEN: ${{ inputs.slack-token }}
        CHANNEL_IDS: ${{ steps.post.outputs.channel-ids }}
        MESSAGE_TSS: ${{ steps.post.outputs.message-tss }}
        REPLY_TEXT: ${{ inputs.thread-reply-text }}
      run: |
        set -euo pipefail
        if [ -z "$CHANNEL_IDS" ] || [ -z "$MESSAGE_TSS" ]; then
          echo "::warning::thread-reply skipped: post step produced no channels/ts (main message may have failed)"
          exit 0
        fi
        IFS=',' read -ra ids <<< "$CHANNEL_IDS"
        IFS=',' read -ra tss <<< "$MESSAGE_TSS"
        if [ "${#ids[@]}" -ne "${#tss[@]}" ]; then
          echo "::warning::thread-reply skipped: channel/ts count mismatch (${#ids[@]} vs ${#tss[@]})"
          exit 0
        fi
        payload=$(jq -nc \
          --arg t "$REPLY_TEXT" \
          '{text: $t}')
        for i in "${!ids[@]}"; do
          ch="${ids[$i]}"
          ts="${tss[$i]}"
          (
            set -euo pipefail
            body=$(jq -c \
              --arg ch "$ch" \
              --arg ts "$ts" \
              '. + {channel: $ch, thread_ts: $ts}' <<<"$payload")
            resp=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_TOKEN" \
              -H "Content-Type: application/json; charset=utf-8" \
              --data "$body")
            if ! printf '%s' "$resp" | jq -e . >/dev/null 2>&1; then
              echo "::warning::thread-reply to $ch (ts $ts) failed: non-JSON response"
              exit 0
            fi
            ok=$(jq -r '.ok' <<<"$resp")
            if [ "$ok" != "true" ]; then
              err=$(jq -r '.error // "unknown"' <<<"$resp")
              echo "::warning::thread-reply to $ch (ts $ts) failed: $err"
            fi
          ) || echo "::warning::thread-reply to $ch (ts $ts) failed: unexpected error (curl/jq aborted)"
        done

    # Implements: HHT-OPS-composite-action-library/A,F
    #   Deploy-notification primitive lives here, not inlined in consumers;
    #   dm-user-email/dm-status extend the declared input/output contract.
    - name: Send DM copy to dm-user-email (opt-in, soft-fail)
      id: dm
      shell: bash
      env:
        SLACK_TOKEN: ${{ inputs.slack-token }}
        DM_EMAIL: ${{ inputs.dm-user-email }}
        TEXT: ${{ inputs.text }}
        BLOCKS: ${{ inputs.blocks }}
        DM_ONLY: ${{ inputs.dm-only }}
      run: |
        set -euo pipefail

        if [ -z "$DM_EMAIL" ]; then
          if [ "$DM_ONLY" = "true" ]; then
            # dm-only with no recipient is a misconfiguration: there is no
            # channel fallback, so this would notify nobody. Hard-fail.
            echo "::error::slack-notify: dm-only mode requires a non-empty dm-user-email, but it was empty. There is no channel post in dm-only mode, so nobody would be notified."
            exit 1
          fi
          echo "dm-status=skipped" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # In channel mode the routed channels already received the message
        # (the post step would have failed the action otherwise), so a DM-side
        # hiccup is soft. In dm-only mode NO channel got it, so a soft-fail
        # here means nobody was notified — the caller's status step turns that
        # `dm-status: soft-failed` into an ::error::. The soft-fail stays a
        # ::warning:: here either way; only the wording changes.
        if [ "$DM_ONLY" = "true" ]; then
          DM_CONTEXT="dm-only mode: NO channel received this message, so nobody was notified"
        else
          DM_CONTEXT="channels already notified"
        fi
        soft_fail() {
          echo "::warning::$1 ($DM_CONTEXT)."
          echo "dm-status=soft-failed" >> "$GITHUB_OUTPUT"
          exit 0
        }

        # 1. Resolve the workspace user by email. Requires the
        # users:read.email bot scope.
        lookup_resp=$(curl -sS --max-time 15 -G \
          -H "Authorization: Bearer $SLACK_TOKEN" \
          --data-urlencode "email=$DM_EMAIL" \
          'https://slack.com/api/users.lookupByEmail') || lookup_resp=""

        if ! printf '%s' "$lookup_resp" | jq -e . >/dev/null 2>&1; then
          soft_fail "Slack users.lookupByEmail returned non-JSON response. DM not sent"
        fi
        if [ "$(echo "$lookup_resp" | jq -r '.ok')" != "true" ]; then
          lookup_err=$(echo "$lookup_resp" | jq -r '.error // "unknown"')
          soft_fail "Slack users.lookupByEmail failed: $lookup_err. Bot may need 'users:read.email' scope, or no workspace user has this email. DM not sent"
        fi
        user_id=$(echo "$lookup_resp" | jq -r '.user.id')

        # 2. Post the same text/blocks to the user ID. chat.postMessage
        # opens the IM conversation implicitly (requires im:write). The
        # blocks JSON was already validated by the post step above — a
        # malformed payload never reaches this step.
        payload=$(jq -n \
          --arg ch "$user_id" \
          --arg txt "$TEXT" \
          '{channel: $ch, text: $txt}')

        if [ -n "$BLOCKS" ]; then
          payload=$(printf '%s' "$payload" \
            | jq --argjson blks "$BLOCKS" '. + {blocks: $blks}')
        fi

        dm_resp=$(curl -sS --max-time 15 -X POST \
          -H "Authorization: Bearer $SLACK_TOKEN" \
          -H 'Content-Type: application/json; charset=utf-8' \
          --data "$payload" \
          'https://slack.com/api/chat.postMessage') || dm_resp=""

        if ! printf '%s' "$dm_resp" | jq -e . >/dev/null 2>&1; then
          soft_fail "Slack chat.postMessage (DM to $user_id) returned non-JSON response. DM not sent"
        fi
        if [ "$(echo "$dm_resp" | jq -r '.ok')" != "true" ]; then
          dm_err=$(echo "$dm_resp" | jq -r '.error // "unknown"')
          soft_fail "Slack chat.postMessage (DM to $user_id) failed: $dm_err. Bot may need 'im:write' scope"
        fi

        echo "DM sent to user $user_id (ts=$(echo "$dm_resp" | jq -r '.ts'))"
        echo "dm-status=sent" >> "$GITHUB_OUTPUT"
