# Sponsor Base Preflight — composite action.
#
# Guards the two ways a sponsor final-image build can embed the wrong core
# base image (CUR-1668):
#
#   1. PINS — every base image reference this build will consume is a content
#      digest, never a mutable tag. A floating `:main-latest` lets two builds
#      of the same sponsor commit resolve different base content, and lets a
#      build started inside the core publish window ship the sponsor half of a
#      two-repo change without the core half. Realizes HSI-OPS-image-promotion/G.
#
#      The caller supplies the references because they are what the build
#      consumes: a sponsor names the upstream commit and the build resolves it
#      to a digest, so no configuration file holds the value being checked.
#
#   2. CAPABILITIES — the pinned portal-server base declares every permission
#      the sponsor's role-permissions.yaml grants. A base that predates a
#      granted Action fails closed at portal boot, surfacing as an opaque
#      Cloud Run startup timeout (the CUR-1624 incident). Deciding it here
#      names the offending permissions instead.
#      Realizes HSI-OPS-image-promotion/H.
#
# The caller must have checked out the sponsor repo and authenticated to the
# registry holding the base image before invoking this action.
#
# CANONICAL HOME: cure-hht/hht_workflows (this file). Consumers invoke via:
#   uses: Cure-HHT/hht_workflows/.github/actions/sponsor-base-preflight@<sha>

name: 'Sponsor Base Preflight'
description: 'Verify sponsor base images are digest-pinned and capability-compatible with the sponsor config.'

inputs:
  base-images:
    description: >
      Newline-delimited list of every base image reference this build will be
      built FROM. Each must be `<name>@sha256:<digest>`. Supplying none is a
      failure: a build whose bases nothing examined has not passed this check.
    required: true
  portal-server-image:
    description: 'Digest-pinned portal-server reference to check capabilities against'
    required: true
  role-permissions:
    description: 'Path to the sponsor role-permissions.yaml'
    required: false
    default: 'deployment/sponsor/role-permissions.yaml'

runs:
  using: 'composite'
  steps:
    - name: Install preflight dependencies
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install --quiet --user 'PyYAML>=6,<7'

    # Implements: HSI-OPS-image-promotion/G
    - name: Verify base images are digest-pinned
      shell: bash
      env:
        BASE_IMAGES: ${{ inputs.base-images }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # The list is handed over whole. Splitting it in shell would mean
        # skipping blank lines, and a blank line is precisely the failure worth
        # catching: an input that resolved to nothing.
        python3 "${ACTION_PATH}/preflight.py" pins --images "$BASE_IMAGES"

    # Implements: HSI-OPS-image-promotion/H
    - name: Verify the pinned base declares every granted permission
      if: steps.extract.outputs.present == 'true'
      shell: bash
      env:
        MANIFEST: ${{ steps.extract.outputs.manifest }}
        GRANTS: ${{ inputs.role-permissions }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        python3 "${ACTION_PATH}/preflight.py" capabilities \
          --declared "${MANIFEST}" \
          --grants "${GRANTS}"
