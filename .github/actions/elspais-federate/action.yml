name: 'elspais federate'
description: 'Link cited Cure-HHT repositories as elspais associates so cross-repo requirement citations resolve.'

# Implements: HHT-OPS-repo-bootstrap/I
inputs:
  associates:
    description: 'Newline-separated owner/repo list of repositories this repo cites. Blank lines and # comments allowed.'
    required: true
  token:
    description: 'Per-job App token with contents:read scoped to exactly the named repositories.'
    required: true
  ref:
    description: "Git ref to check each associate out at. Empty means each repository's default branch."
    required: false
    default: ''
  workspace-parent:
    description: 'Directory the associates are cloned into, as siblings of this checkout.'
    required: false
    default: '..'
  link:
    description: >-
      When 'false', clone each associate but skip `elspais associate` (host
      does not have elspais on PATH -- e.g. it runs inside a container that
      does). The caller is responsible for linking the printed paths itself.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Resolve associate list
      id: parse
      shell: bash
      env:
        ASSOCIATES: ${{ inputs.associates }}
      run: |
        set -euo pipefail
        entries="$(python3 "${{ github.action_path }}/parse_associates.py")"
        if [ -z "$entries" ]; then
          echo "::error::no associates resolved from the provided list"
          exit 1
        fi
        echo "entries<<EOF" >> "$GITHUB_OUTPUT"
        echo "$entries" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"
        echo "resolved associates:"
        echo "$entries"

    - name: Clone each associate
      id: clone
      shell: bash
      env:
        ENTRIES: ${{ steps.parse.outputs.entries }}
        TOKEN: ${{ inputs.token }}
        REF: ${{ inputs.ref }}
        PARENT: ${{ inputs.workspace-parent }}
      run: |
        set -euo pipefail
        mkdir -p "$PARENT"
        dests=""
        while IFS= read -r entry; do
          [ -n "$entry" ] || continue
          # Derive dest from the full owner/repo, not just the repo basename:
          # two associates with the same repo name under different owners
          # would otherwise collide on the same dest and the second would
          # silently link against the first associate's requirements.
          dest="$PARENT/$(printf '%s' "$entry" | tr '/' '_')"

          if [ -d "$dest/.git" ]; then
            echo "associate $entry already present at $dest"
          else
            # Sparse + shallow: only the requirements graph is needed.
            git clone --depth 1 --filter=blob:none --sparse \
              ${REF:+--branch "$REF"} \
              "https://x-access-token:${TOKEN}@github.com/${entry}.git" "$dest"
            # Drop the credential from the clone's stored remote so the token
            # does not persist in .git/config for the rest of the job.
            git -C "$dest" remote set-url origin "https://github.com/${entry}.git"
            git -C "$dest" sparse-checkout set spec .elspais.toml
          fi

          if [ ! -f "$dest/.elspais.toml" ]; then
            echo "::error::associate $entry has no .elspais.toml; it cannot be linked"
            exit 1
          fi

          dests="${dests}${dest}$(printf '\n')"
        done <<< "$ENTRIES"
        echo "dests<<EOF" >> "$GITHUB_OUTPUT"
        printf '%s' "$dests" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

    # `link: false` means elspais is not on the host (a consumer running
    # `elspais checks` inside a container, where elspais exists only in the
    # image, must clone here on the host into a path inside the container's
    # bind mount and then run `elspais associate` itself, inside the
    # container). Skip host-side linking so this step does not fail with
    # command-not-found on such a host.
    - name: Link each associate
      if: inputs.link != 'false'
      shell: bash
      env:
        DESTS: ${{ steps.clone.outputs.dests }}
      run: |
        set -euo pipefail
        while IFS= read -r dest; do
          [ -n "$dest" ] || continue
          elspais associate "$dest"
        done <<< "$DESTS"

    - name: Show linked associates
      if: inputs.link != 'false'
      shell: bash
      run: |
        set -euo pipefail
        elspais associate --list

    - name: Report cloned associate paths
      if: inputs.link == 'false'
      shell: bash
      env:
        DESTS: ${{ steps.clone.outputs.dests }}
      run: |
        set -euo pipefail
        echo "link: false — cloned associates but did not run elspais associate."
        echo "Caller is responsible for linking these paths itself:"
        printf '%s' "$DESTS"
