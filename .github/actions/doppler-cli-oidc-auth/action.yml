name: Doppler CLI OIDC auth (org-standard)
description: >
  Mints a CLI-usable Doppler token via GitHub OIDC for a single audit identity
  and exposes it as a masked DOPPLER_TOKEN env var. Unlike doppler-oidc-auth
  (which injects secrets from a single config as env vars), this action does
  NOT fetch any secret values -- it just authenticates the doppler CLI for the
  job. Callers then invoke `doppler configs ...` and `doppler secrets ...`
  using the identity's permissions.

  Pin this action by SHA from consumer workflows; never by branch or tag.

inputs:
  doppler_identity_id:
    description: >
      UUID of the Doppler service-account identity to authenticate as. The
      identity must be configured in Doppler dashboard to accept the caller's
      workflow as an OIDC source (subject claim should be bound to the
      specific job_workflow_ref). Pass via vars.<NAME> from caller; do NOT
      hardcode.
    required: true

runs:
  using: composite
  steps:
    # Implements: HHT-OPS-identity-over-keys/B
    #   CI -> Doppler auth via OIDC; no static DOPPLER_TOKEN anywhere.
    # Implements: HHT-OPS-composite-action-library/A,B,F
    #   Cross-repo CI primitive; declared input contract; SHA-pinned consumers.
    - name: Mint Doppler token via GitHub OIDC and mask it before export
      id: mint
      shell: bash
      env:
        DOPPLER_IDENTITY_ID: ${{ inputs.doppler_identity_id }}
      run: |
        set -euo pipefail

        # http_call NAME [curl args...]
        # curl without -f: transport rc and HTTP status are captured and decided
        # on explicitly, so every failure tier prints a named diagnostic instead
        # of killing the step with a bare exit code. The response body lands in
        # "$HTTP_BODY_FILE"; success bodies of the token calls contain credentials
        # and are never echoed — only failure bodies (error documents) print.
        HTTP_BODY_FILE="$(mktemp)"
        http_call() {
          local name="$1"; shift
          local rc=0 status
          status="$(curl -sS -o "$HTTP_BODY_FILE" -w '%{http_code}' "$@")" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::${name} got no HTTP response (curl exit ${rc}: DNS/TLS/timeout/connection). Check runner network and the endpoint's availability."
            exit 1
          fi
          if [ "$status" -ge 400 ]; then
            echo "::error::${name} failed with HTTP ${status}. Response: $(cat "$HTTP_BODY_FILE")"
            exit 1
          fi
        }

        # Fetch a GitHub OIDC token bound to this job. The audience MUST match
        # what the Doppler identity is configured to accept; Doppler's default
        # for GitHub provider is https://github.com/<org>.
        http_call "GitHub OIDC token fetch" \
          -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://github.com/Cure-HHT"
        OIDC_TOKEN="$(jq -r '.value' "$HTTP_BODY_FILE")"
        if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
          echo "::error::GitHub OIDC token fetch returned HTTP 200 but no token value for audience https://github.com/Cure-HHT."
          exit 1
        fi

        # Exchange the OIDC token for a Doppler CLI token (POST /v3/auth/oidc,
        # body {identity, token}). A 401 here usually means the identity's OIDC
        # trust rule does not accept this workflow's job_workflow_ref.
        http_call "Doppler OIDC token exchange (identity ${DOPPLER_IDENTITY_ID})" \
          -X POST \
          -H 'accept: application/json' \
          -H 'content-type: application/json' \
          --data "$(jq -nc \
            --arg id "$DOPPLER_IDENTITY_ID" \
            --arg token "$OIDC_TOKEN" \
            '{identity: $id, token: $token}')" \
          'https://api.doppler.com/v3/auth/oidc'
        DOPPLER_TOKEN="$(jq -r '.token' "$HTTP_BODY_FILE")"
        if [ -z "$DOPPLER_TOKEN" ] || [ "$DOPPLER_TOKEN" = "null" ]; then
          echo "::error::Doppler OIDC exchange returned HTTP 200 but no token. Messages: $(jq -r '.messages // empty' "$HTTP_BODY_FILE")"
          exit 1
        fi

        # CRITICAL: mask FIRST, then export. Without this ordering, the
        # token's first appearance is unmasked.
        if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
          printf '::add-mask::%s\n' "$DOPPLER_TOKEN"
        fi
        printf 'DOPPLER_TOKEN=%s\n' "$DOPPLER_TOKEN" >> "$GITHUB_ENV"

        # Self-check: the token works AND the identity has at least one project's
        # read access. Doppler returns HTTP 200 with {"projects": []} for a
        # zero-permission identity, so the body must be parsed to catch "valid
        # but useless". The body carries no token value — safe to read.
        http_call "Doppler project-access self-check" \
          -H "authorization: Bearer $DOPPLER_TOKEN" \
          'https://api.doppler.com/v3/projects?per_page=1'
        if ! jq -e '.projects | length > 0' "$HTTP_BODY_FILE" >/dev/null; then
          echo "::error::Minted Doppler token has no project access (HTTP 200, empty project list). The identity may be unbound, missing project memberships, or scoped to zero projects in the Doppler dashboard."
          exit 1
        fi
        rm -f "$HTTP_BODY_FILE"
