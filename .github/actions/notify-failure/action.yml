# notify-failure — composite action.
#
# The single way a workflow announces its own failure. Derives failure
# context from the run's OWN jobs (no per-workflow configuration, no
# workflow-name list anywhere), composes the message, and delegates the
# post to the canonical slack-notify composite.
#
# CANONICAL HOME: cure-hht/hht_workflows (this file).
# Callers add a standard job — see README.md "notify-failure".
#
# The caller MUST:
#   - run actions/checkout first (slack-notify reads the routing file from
#     the caller's workspace), and
#   - grant `actions: read` (the jobs lookup 403s without it).
#
# Implements: HHT-OPS-failure-notification-routing/A+B+D
# Implements: HHT-OPS-composite-action-library/A

name: 'notify-failure'
description: 'Announce the current workflow run failure to the operations channel'

inputs:
  slack-token:
    description: Slack bot OAuth token (xoxb-...).
    required: true
  event:
    description: >
      Routing key looked up in the caller's slack-channels.yml. The default
      `workflow-failure` is a FLAT key (single channel) so callers with no
      build flavor need no `env`.
    required: false
    default: workflow-failure
  env:
    description: >
      Routing sub-key. Pass ONLY when `event` names an env-keyed route;
      slack-notify errors by design on a flat/env-keyed mismatch.
    required: false
    default: ""
  hints:
    description: >
      Optional JSON object string mapping a failed step's `name` — exactly
      as the jobs API reports it, not the step `id` — to hint text, e.g.
      '{"Upload to Google Play": "Play rejected the upload; check the track."}'.
      Unmatched or absent produces no hint line. Malformed JSON is warned
      about and ignored, never fatal.
    required: false
    default: ""
  evidence-url:
    description: >
      Optional exact URL for a run-scoped evidence artifact. When provided,
      the failure message includes a Slack link to the artifact. Empty keeps
      the existing message unchanged.
    required: false
    default: ""
  evidence-label:
    description: Link label used when evidence-url is provided.
    required: false
    default: Download workflow evidence
  routing-file:
    description: Path to routing YAML, relative to the caller's workspace.
    required: false
    default: .github/slack-channels.yml

outputs:
  post-status:
    description: >
      `ok` when the announcement reached at least one channel, `soft-failed`
      when it did not (an ::error:: annotation is also emitted so the failure
      is visible on the run without depending on Slack).
    value: ${{ steps.status.outputs.post-status }}

runs:
  using: 'composite'
  steps:
    - name: Derive failure context
      id: ctx
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_HINTS: ${{ inputs.hints }}
        INPUT_EVIDENCE_URL: ${{ inputs.evidence-url }}
        INPUT_EVIDENCE_LABEL: ${{ inputs.evidence-label }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/derive_context.py"

    # Soft-failed by design: a Slack outage must not repaint an otherwise
    # green run. The status step below makes that soft failure visible.
    - name: Post failure notification
      id: post
      continue-on-error: true
      uses: Cure-HHT/hht_workflows/.github/actions/slack-notify@19c240bef771d9180776416d125719e2d72c8725  # v1.11.0
      with:
        # dm-only when derive_context resolved the dispatcher to an email; the
        # slack-notify call then skips channels and DMs the triggerer only.
        # In channel mode `event`/`env` route as before and `dm-email` is the
        # committer (push) or empty (schedule / unresolved dispatch).
        dm-only: ${{ steps.ctx.outputs.mode == 'dm-only' }}
        event: ${{ inputs.event }}
        env: ${{ inputs.env }}
        text: ${{ steps.ctx.outputs.text }}
        slack-token: ${{ inputs.slack-token }}
        routing-file: ${{ inputs.routing-file }}
        dm-user-email: ${{ steps.ctx.outputs.dm-email }}

    # Implements: HHT-OPS-failure-notification-routing/D
    #   The announcement path's own failure is reported over GitHub's
    #   annotation channel, which does not depend on Slack.
    #
    # `if: always()` is load-bearing. Composite steps default to
    # `if: success()`, so if the context derivation hard-fails the post step
    # is skipped AND this step would be skipped too — no Slack post and no
    # ::error:: annotation, i.e. assertion D breaks exactly when it matters
    # most. Running unconditionally means the `POST_OUTCOME != success`
    # branch below reports the skipped/empty case, which is the truth.
    - name: Report delivery status
      id: status
      if: always()
      shell: bash
      env:
        POST_OUTCOME: ${{ steps.post.outcome }}
        CHANNEL_IDS: ${{ steps.post.outputs.channel-ids }}
        MODE: ${{ steps.ctx.outputs.mode }}
        DM_STATUS: ${{ steps.post.outputs.dm-status }}
      run: |
        set -euo pipefail
        # dm-only success is the DM being SENT — there is no channel to point
        # at. Channel mode success is at least one channel ID present. MODE
        # defaults to `channel` when unset so the extracted-body readiness
        # check (which sets only the two channel-mode vars) still reports `ok`.
        MODE="${MODE:-channel}"
        if [ "$MODE" = "dm-only" ]; then
          if [ "$POST_OUTCOME" = "success" ] && [ "${DM_STATUS:-}" = "sent" ]; then
            echo "post-status=ok" >> "$GITHUB_OUTPUT"
            echo "Failure announcement delivered as a DM to the run's triggerer."
          else
            echo "post-status=soft-failed" >> "$GITHUB_OUTPUT"
            echo "::error::notify-failure: the failure announcement did NOT reach Slack (dm-only mode; post outcome: ${POST_OUTCOME:-unknown}, dm-status: ${DM_STATUS:-unknown}). This run failed AND its notification failed — investigate the Slack token, the triggerer's email, and workspace membership."
          fi
        else
          if [ "$POST_OUTCOME" = "success" ] && [ -n "${CHANNEL_IDS:-}" ]; then
            echo "post-status=ok" >> "$GITHUB_OUTPUT"
            echo "Failure announcement delivered to: $CHANNEL_IDS"
          else
            echo "post-status=soft-failed" >> "$GITHUB_OUTPUT"
            echo "::error::notify-failure: the failure announcement did NOT reach Slack (post outcome: ${POST_OUTCOME:-unknown}). This run failed AND its notification failed — investigate the Slack token, routing key, and channel membership."
          fi
        fi
