# Build the URS PDF + DOCX deliverables from a consumer repo.
#
# Wraps scripts/urs-compile/compile-urs.sh. Callers check out the
# consumer repo (and optionally a sibling associate repo) before
# invoking this action.
#
# Example caller (in the consumer repo):
#
#   - uses: actions/checkout@v4
#     with: { path: primary }
#   - uses: Cure-HHT/hht_workflows/.github/actions/build-urs@<commit>
#     with:
#       primary-root: primary
#       associate-commits: |
#         cure-hht/hht_diary@<40-hex commit>
#       registry-token: ${{ secrets.GITHUB_TOKEN }}
#       elspais-version: ${{ env.ELSPAIS_VERSION }}  # from .github/versions.env
#
# Each associate is obtained from the artifact it published for that commit, so
# the deliverable and the build it describes name one revision. The action is
# itself pinned by the reference above, and records that reference in the
# provenance file beside the deliverables.

name: Build URS
description: |
  Produce URS PDF + DOCX deliverables from a consumer repo holding
  spec/URS-manifest/ (cover, sponsor-info.yaml, frontmatter) and a
  sibling associate repo providing cross-referenced spec content.

inputs:
  primary-root:
    description: |
      Path to the consumer repo worktree containing spec/URS-manifest/
      and the elspais config. Defaults to GITHUB_WORKSPACE.
    required: false
    default: ${{ github.workspace }}
  associate-root:
    description: |
      Optional path to a sibling repo worktree contributing spec
      content via the federated elspais graph and pandoc image
      resource paths.
    required: false
    default: ""
  python-version:
    description: Python version to set up for the build.
    required: false
    default: "3.12"
  elspais-version:
    description: |
      Exact elspais release to install from PyPI (e.g. "0.117.81"), so URS
      builds are reproducible and traceable to a known tool version. Pass the
      value from the caller repo's .github/versions.env (ELSPAIS_VERSION).
    required: true
  pandoc-version:
    description: |
      Exact pandoc release to install (e.g. "3.1.3"). The docx reference is
      seeded from pandoc's default data file, so the pandoc version decides
      the style names the deliverable carries; pinning it keeps a CI build
      byte-comparable with a local one.
    required: false
    default: "3.1.3"
  manifest:
    description: |
      Path (relative to primary-root) of the URS manifest to compile.
      Defaults to spec/URS-manifest/urs.yaml. The output basename derives
      from this filename.
    required: false
    default: "spec/URS-manifest/urs.yaml"
  associate-roots:
    description: |
      Newline-delimited list of associate source repo paths to federate
      (multi-source). Takes precedence over the single associate-root input.
      Each path must be a checked-out elspais repo.
    required: false
    default: ""
  output-basename:
    description: |
      Override the output basename (default: the manifest filename stem).
      Produces docs/<basename>.pdf and .docx.
    required: false
    default: ""
  associate-commits:
    description: |
      Newline-delimited `owner/repo@<40-hex commit>` list naming the
      repositories whose spec content federates into this compile. Each is
      obtained from the artifact that repository published for that commit,
      so the compiled deliverable and the pinned build describe one revision.

      Mutually exclusive with associate-root / associate-roots: a run that
      supplied both could compile from two revisions while reporting one.
    required: false
    default: ""
  registry-token:
    description: |
      Token with read access to the upstream artifacts named in
      associate-commits. Required when that input is set.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Python build dependencies
      shell: bash
      run: |
        pip install -r "${{ github.action_path }}/../../../scripts/urs-compile/requirements-compile.txt"

    - name: Install pandoc + LaTeX engine
      shell: bash
      env:
        PANDOC_VERSION: ${{ inputs.pandoc-version }}
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          texlive-xetex \
          texlive-latex-extra \
          texlive-fonts-recommended \
          fonts-liberation \
          librsvg2-bin
        # pandoc from its own release, not the runner image: the docx
        # reference is seeded from pandoc's default data file, so the
        # emitted style names track the pandoc version. Ubuntu's package
        # moves with the image and would drift the deliverable silently.
        deb="$(mktemp --suffix=.deb)"
        curl -fsSL -o "$deb" \
          "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
        sudo dpkg -i "$deb"
        rm -f "$deb"
        installed="$(pandoc --version | head -1 | awk '{print $2}')"
        if [ "$installed" != "${PANDOC_VERSION}" ]; then
          echo "::error::pandoc ${installed} installed, expected ${PANDOC_VERSION}" >&2
          exit 1
        fi

    - name: Install elspais
      shell: bash
      env:
        ELSPAIS_VERSION: ${{ inputs.elspais-version }}
      run: |
        if [ -z "${ELSPAIS_VERSION}" ]; then
          echo "::error::elspais-version input is required (pass ELSPAIS_VERSION from the caller's .github/versions.env) so URS builds are traceable to a pinned release." >&2
          exit 1
        fi
        pip install "elspais==${ELSPAIS_VERSION}"

    # A deliverable enumerates obligations; the build it describes is pinned.
    # Obtaining the spec source from the artifact published for that same pin
    # is what stops the two being different revisions. The decisions live in
    # obtain-associates.sh rather than here so a suite can run what executes:
    # this route is skipped whenever a caller supplies paths, which is every
    # caller until the first consumer pins.
    - name: Obtain the pinned associates
      id: associates
      if: inputs.associate-commits != ''
      shell: bash
      env:
        COMMITS: ${{ inputs.associate-commits }}
        TOKEN: ${{ inputs.registry-token }}
        PATH_ROOT: ${{ inputs.associate-root }}
        PATH_ROOTS: ${{ inputs.associate-roots }}
      run: |
        "${{ github.action_path }}/obtain-associates.sh"

    - name: Run URS compile
      shell: bash
      env:
        MANIFEST: ${{ inputs.manifest }}
        ASSOCIATE_ROOTS: ${{ steps.associates.outputs.roots || inputs.associate-roots }}
        OUTPUT_BASENAME: ${{ inputs.output-basename }}
        # The provenance record names the tool by the reference that invoked it.
        # Named here so the value a reviewer reads in the caller's `uses:` line
        # is visible where the compile is configured. Under its own name rather
        # than the runner's: these contexts are empty for a locally-`uses:`d
        # action, and overriding GITHUB_ACTION_* with an empty string would
        # discard the value the runner had filled in correctly.
        URS_TOOL_REPOSITORY: ${{ github.action_repository }}
        URS_TOOL_REF: ${{ github.action_ref }}
      run: |
        "${{ github.action_path }}/../../../scripts/urs-compile/compile-urs.sh" \
          "${{ inputs.primary-root }}" \
          "${{ inputs.associate-root }}"

    - name: Upload URS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: urs-deliverables
        path: |
          ${{ inputs.primary-root }}/docs/*.pdf
          ${{ inputs.primary-root }}/docs/*.docx
          ${{ inputs.primary-root }}/docs/*-build-provenance.md
        retention-days: 30
