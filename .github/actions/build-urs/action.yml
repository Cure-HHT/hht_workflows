# Build the URS PDF + DOCX deliverables from a consumer repo.
#
# Wraps scripts/urs-compile/compile-urs.sh. Callers check out the
# consumer repo (and optionally a sibling associate repo) before
# invoking this action.
#
# Example caller (in the consumer repo):
#
#   - uses: actions/checkout@v4
#     with: { path: primary }
#   - uses: actions/checkout@v4
#     with:
#       repository: Cure-HHT/hht_diary
#       path: associate
#       token: ${{ secrets.ASSOCIATE_REPO_TOKEN }}
#   - uses: Cure-HHT/hht_workflows/.github/actions/build-urs@main
#     with:
#       primary-root: primary
#       associate-root: associate
#       elspais-version: ${{ env.ELSPAIS_VERSION }}  # from .github/versions.env

name: Build URS
description: |
  Produce URS PDF + DOCX deliverables from a consumer repo holding
  spec/URS-manifest/ (cover, sponsor-info.yaml, frontmatter) and a
  sibling associate repo providing cross-referenced spec content.

inputs:
  primary-root:
    description: |
      Path to the consumer repo worktree containing spec/URS-manifest/
      and the elspais config. Defaults to GITHUB_WORKSPACE.
    required: false
    default: ${{ github.workspace }}
  associate-root:
    description: |
      Optional path to a sibling repo worktree contributing spec
      content via the federated elspais graph and pandoc image
      resource paths.
    required: false
    default: ""
  python-version:
    description: Python version to set up for the build.
    required: false
    default: "3.12"
  elspais-version:
    description: |
      Exact elspais release to install from PyPI (e.g. "0.121.218"), so URS
      builds are reproducible and traceable to a known tool version. Pass the
      value from the caller repo's .github/versions.env (ELSPAIS_VERSION).
    required: true
  manifest:
    description: |
      Path (relative to primary-root) of the URS manifest to compile.
      Defaults to spec/URS-manifest/urs.yaml. The output basename derives
      from this filename.
    required: false
    default: "spec/URS-manifest/urs.yaml"
  associate-roots:
    description: |
      Newline-delimited list of associate source repo paths to federate
      (multi-source). Takes precedence over the single associate-root input.
      Each path must be a checked-out elspais repo.
    required: false
    default: ""
  output-basename:
    description: |
      Override the output basename (default: the manifest filename stem).
      Produces docs/<basename>.pdf and .docx.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Python build dependencies
      shell: bash
      run: |
        pip install -r "${{ github.action_path }}/../../../scripts/urs-compile/requirements-compile.txt"

    - name: Install pandoc + LaTeX engine
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pandoc \
          texlive-xetex \
          texlive-latex-extra \
          texlive-fonts-recommended \
          fonts-liberation \
          librsvg2-bin

    - name: Install elspais
      shell: bash
      env:
        ELSPAIS_VERSION: ${{ inputs.elspais-version }}
      run: |
        if [ -z "${ELSPAIS_VERSION}" ]; then
          echo "::error::elspais-version input is required (pass ELSPAIS_VERSION from the caller's .github/versions.env) so URS builds are traceable to a pinned release." >&2
          exit 1
        fi
        pip install "elspais==${ELSPAIS_VERSION}"

    - name: Run URS compile
      shell: bash
      env:
        MANIFEST: ${{ inputs.manifest }}
        ASSOCIATE_ROOTS: ${{ inputs.associate-roots }}
        OUTPUT_BASENAME: ${{ inputs.output-basename }}
      run: |
        "${{ github.action_path }}/../../../scripts/urs-compile/compile-urs.sh" \
          "${{ inputs.primary-root }}" \
          "${{ inputs.associate-root }}"

    - name: Upload URS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: urs-deliverables
        path: |
          ${{ inputs.primary-root }}/docs/*.pdf
          ${{ inputs.primary-root }}/docs/*.docx
        retention-days: 30
