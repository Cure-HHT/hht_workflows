---
# Prove a release's evidence bundle complete before it is locked.
#
# A retention lock cannot be undone, so the bundle is proved first: restored
# into this runner, which holds nothing of the estate, run with no network
# access, and used to rebuild the deliverables it ships. A hash proves the
# archive is the bytes that were uploaded; it does not prove those bytes can
# rebuild anything, which is the claim a custodian relies on.
#
# The verdict is uploaded whatever it says, before the refusal: evidence of a
# rebuild that failed is still evidence. The last step is the refusal, and the
# job that writes to the locked store must depend on it.
#
# Example caller:
#
#   - uses: Cure-HHT/hht_workflows/.github/actions/prove-release-bundle@<40-char commit SHA>
#     with:
#       bundle: release-bundle
#
# Run it in a job of its own, on a fresh runner, with the bundle downloaded as
# its only input: a runner that assembled the bundle holds the files the bundle
# may have forgotten.

name: Prove a release evidence bundle
description: >
  Check a release evidence bundle against its manifest, rebuild its
  deliverables offline from its own toolchain and sources, record the verdict,
  and refuse a bundle whose rebuild did not reproduce what shipped.

inputs:
  bundle:
    description: Path to the unpacked bundle directory (the one holding MANIFEST).
    required: true
  verdict-name:
    description: Artifact name for the uploaded verdict.
    required: false
    default: offline-rebuild-verdict

outputs:
  verdict:
    description: Path to the verdict JSON.
    value: ${{ steps.rebuild.outputs.verdict }}
  manifest-sha256:
    description: SHA-256 of the bundle's MANIFEST, which the verdict is bound to.
    value: ${{ steps.rebuild.outputs.manifest-sha256 }}

runs:
  using: composite
  steps:
    - name: Rebuild the deliverables offline
      id: rebuild
      shell: bash
      env:
        BUNDLE: ${{ inputs.bundle }}
        HERE: ${{ github.action_path }}
      run: |
        set -euo pipefail
        verdict="${RUNNER_TEMP}/offline-rebuild-verdict.json"
        "${HERE}/../../../scripts/release-bundle/rebuild.sh" "$BUNDLE" "$verdict"
        echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
        echo "manifest-sha256=$(sha256sum "${BUNDLE}/MANIFEST" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    - name: Keep the verdict
      if: always() && steps.rebuild.outputs.verdict != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: ${{ inputs.verdict-name }}
        path: ${{ steps.rebuild.outputs.verdict }}
        if-no-files-found: error

    - name: Refuse a bundle the rebuild did not prove
      shell: bash
      env:
        BUNDLE: ${{ inputs.bundle }}
        VERDICT: ${{ steps.rebuild.outputs.verdict }}
        HERE: ${{ github.action_path }}
      run: |
        set -euo pipefail
        python3 "${HERE}/../../../scripts/release-bundle/bundle.py" admit --bundle "$BUNDLE" --verdict "$VERDICT"
