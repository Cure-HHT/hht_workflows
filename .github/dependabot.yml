# Dependabot — GitHub Actions dependency updates.
#
# Tracks the actions this repo depends on across .github/workflows and the
# composite actions under .github/actions: the SHA-pinned upstreams wrapped by
# the composite actions (docker/*, dopplerhq/*, google-github-actions/*,
# sigstore/*) plus the tag-pinned `actions/*` used in workflows (e.g.
# actions/checkout@v4). Dependabot opens a reviewed, grouped, weekly PR per
# update and never auto-merges, preserving each ref's existing style (a
# SHA-pinned ref is rewritten to the new SHA + version comment; a tag ref to
# the new tag).
#
# Implements: HHT-OPS-composite-action-library (consumer-notification leg; CUR-1422)
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "[Dependabot]"
      include: "scope"
    # Group backward-compatible bumps into one weekly PR; majors stay
    # separate for individual contract review.
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
