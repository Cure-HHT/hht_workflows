# Dependabot — GitHub Actions dependency updates.
#
# Tracks the third-party actions this repo SHA-pins (docker/*, dopplerhq/*,
# google-github-actions/*, sigstore/*, actions/*) across .github/workflows and
# the composite actions under .github/actions. Dependabot maps each pinned SHA
# to the action's latest release tag and opens a reviewed, grouped, weekly PR;
# it never auto-merges and keeps the SHA-pin style (rewriting the SHA + a
# version comment in place).
#
# Implements: HHT-OPS-composite-action-library (consumer-notification leg; CUR-1422)
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "[Dependabot]"
      include: "scope"
    # Group backward-compatible bumps into one weekly PR; majors stay
    # separate for individual contract review.
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
