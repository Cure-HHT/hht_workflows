# Enforces that every workflow in THIS repo triggered by push, schedule, or
# workflow_dispatch carries the standard notify-failure job, and that no
# workflow announces failure off an enumeration of workflow names. Without
# this check the convention depends on authors remembering.
#
# This repo is the canonical home of notify-failure-lint, so it runs the
# LOCAL action rather than a SHA-pinned release: a PR that regresses the
# checker is then caught by the checker it is regressing, on the same run.
# The fixture-based readiness for the action itself lives in
# readiness-checks.yml (`notify-failure-lint-readiness`) — that job proves the
# checker works; this workflow applies it to our own tree.
#
# Implements: HHT-OPS-failure-notification-routing/E+F

name: notify-failure presence

on:
  pull_request:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

# A newer push to the same pull request supersedes the lint of the older one.
concurrency:
  group: notify-presence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  notify-failure-presence:
    name: notify-failure-presence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/notify-failure-lint
