# Security - Check for Secrets — emits a check named exactly
# "Security - Check for Secrets" to satisfy the org-level
# branch-protection ruleset's required context.
#
# This is hht_workflows's own consumption of the canonical composite action
# at .github/actions/secrets-scan/. Other Cure-HHT repos consume the
# same logic by `uses: Cure-HHT/hht_workflows/.github/actions/secrets-scan@<ref>`.

name: Security - Check for Secrets

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Security - Check for Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for gitleaks
      - uses: ./.github/actions/secrets-scan

  # Implements: HHT-OPS-failure-notification-routing/A
  #   The standard job, verbatim — notify-failure-lint checks it literally.
  notify-failure:
    name: Notify failure
    needs: [scan]
    if: ${{ !cancelled() && contains(needs.*.result, 'failure') && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: Cure-HHT/hht_workflows/.github/actions/notify-failure@4a7ad15496d2368acd0da1a3d6dd44b8a645ea5b  # v1.9.0
        with:
          slack-token: ${{ secrets.SLACK_APP_OATH_TOKEN }}
