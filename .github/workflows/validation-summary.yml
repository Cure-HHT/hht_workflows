# Validation Summary — aggregates all other check runs into a single
# required status named "Validation Summary", to satisfy the org-level
# branch-protection ruleset's required context.
#
# This is hht_workflows's own consumption of the canonical composite action
# at .github/actions/validation-summary/. Other Cure-HHT repos consume
# the same logic by `uses: Cure-HHT/hht_workflows/.github/actions/validation-summary@<ref>`.
#
# Trigger types must mirror the underlying check workflows so this
# supervisor re-evaluates on every event that re-fires its workers —
# notably `edited`, which re-runs PR-title validation on PR title/body
# edits.

name: Validation Summary

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: validation-summary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read       # actions/checkout for local ./.github/actions/... resolution
  checks: read
  statuses: read
  actions: read
  pull-requests: write

jobs:
  gate:
    name: Validation Summary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6  # required for ./.github/actions resolution
      - uses: ./.github/actions/validation-summary
