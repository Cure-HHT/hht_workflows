# Validate PR Title — emits a check named exactly "Validate PR Title"
# to satisfy the org-level branch-protection ruleset's required context.
#
# This is hht_workflows's own consumption of the canonical composite action
# at .github/actions/validate-pr-title/. Other Cure-HHT repos consume the
# same logic by `uses: Cure-HHT/hht_workflows/.github/actions/validate-pr-title@<ref>`.

name: Validate PR Title

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: validate-pr-title-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1; required for ./.github/actions resolution
      - uses: ./.github/actions/validate-pr-title
