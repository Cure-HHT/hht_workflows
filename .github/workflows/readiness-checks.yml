name: Readiness Checks

# Per-action readiness checks for the composite actions in this repo.
# Each action SHOULD add a job here that exercises its happy path against
# real (or stubbed) backends — verifying the action + its environmental
# prerequisites (WIF binding, OIDC handshake, etc.) are wired up correctly
# before the action can be safely consumed downstream. This workflow is the
# canonical PR-gate for action releases.

on:
  # push: limited to `main` only. Without a branch filter, push fires on every
  # feature-branch commit AND pull_request fires for the same PR commit, and
  # GitHub disambiguates by appending `(push)` / `(pull_request)` to the check
  # name. Branch protection's required-check name is the bare form
  # (`Readiness Checks / no-op`), so the suffix would prevent it from ever
  # resolving. Restricting push to main eliminates the collision: on PRs only
  # pull_request fires (bare name); on main only push fires (also bare name,
  # after merge — informational, not gating).
  push:
    branches: [main]
    paths:
      - '.github/actions/**'
      - '.github/workflows/readiness-checks.yml'
  pull_request: {}    # always run on PR so the required status check always reports
  workflow_dispatch: {}

concurrency:
  group: readiness-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doppler-oidc-auth:
    # Implements: HHT-OPS-identity-over-keys/B
    #   End-to-end readiness check of the Doppler OIDC handshake via the composite action.
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required by the Doppler OIDC exchange
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Doppler secrets via doppler-oidc-auth
        uses: ./.github/actions/doppler-oidc-auth
        with:
          doppler_identity_id: ${{ vars.READINESS_DOPPLER_IDENTITY_ID }}
          doppler_project: ${{ vars.READINESS_DOPPLER_PROJECT }}
          doppler_config: ${{ vars.READINESS_DOPPLER_CONFIG }}
      - name: Verify the readiness secret is present and correct
        # The composite action injects all secrets in (project, config) as
        # masked env vars. We read READINESS_OK directly from env. If the
        # OIDC exchange or fetch failed, this var is unset and the job fails.
        # We never print the value itself — even masked, echoing fetched
        # secrets sets a bad precedent for downstream callers copying this
        # pattern. Length is enough to distinguish unset vs wrong-value.
        run: |
          set -euo pipefail
          if [ -z "${READINESS_OK:-}" ]; then
            echo "Doppler readiness check failed: READINESS_OK is unset (fetch did not run or secret not present in target config)"
            exit 1
          fi
          if [ "${READINESS_OK}" != "yes" ]; then
            echo "Doppler readiness check failed: READINESS_OK does not match expected value (got ${#READINESS_OK}-char value, contents not printed)"
            exit 1
          fi
          echo "Doppler OIDC handshake verified; readiness secret was fetched and matches expected value."

  doppler-cli-oidc-auth:
    # Implements: HHT-OPS-identity-over-keys/B
    # Implements: HHT-OPS-composite-action-library/A,B,F
    #   End-to-end readiness check of the CLI-token-mint variant of the
    #   Doppler OIDC handshake. Distinct from doppler-oidc-auth above:
    #   this action only authenticates the doppler CLI for the job; it
    #   does NOT fetch any secret values. We verify by installing the
    #   CLI and asserting it can list projects with the minted token.
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required by the Doppler OIDC exchange
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Doppler CLI
        # Pin Doppler CLI version. Mirrors hht_admin's canonical pin in
        # cure-hht/hht_admin/.github/versions.env (DOPPLER_CLI_VERSION) so
        # the readiness check exercises the action against the same CLI
        # version downstream consumers run in production. Bump path: bump
        # in hht_admin/.github/versions.env first, then update this inline
        # pin to match.
        env:
          DOPPLER_CLI_VERSION: v3.75.1
        run: |
          set -euo pipefail
          curl -Ls --tlsv1.2 --proto "=https" --retry 3 \
            https://cli.doppler.com/install.sh \
            | sudo sh -s -- --version "${DOPPLER_CLI_VERSION#v}"
          doppler --version
      - name: Mint Doppler CLI token via doppler-cli-oidc-auth
        # Reuse the existing readiness identity if a CLI-specific one is
        # not provisioned. The action only needs the identity ID; project
        # / config scoping happens later via CLI invocations.
        uses: ./.github/actions/doppler-cli-oidc-auth
        with:
          doppler_identity_id: ${{ vars.READINESS_DOPPLER_CLI_IDENTITY_ID || vars.READINESS_DOPPLER_IDENTITY_ID }}
      - name: Assert DOPPLER_TOKEN is set in env
        # The action exports DOPPLER_TOKEN to $GITHUB_ENV after masking it.
        # We only check that it is non-empty; the action's own self-check
        # already validated the token works against /v3/projects.
        run: |
          set -euo pipefail
          if [ -z "${DOPPLER_TOKEN:-}" ]; then
            echo "::error::DOPPLER_TOKEN unset after doppler-cli-oidc-auth (action did not export the token)"
            exit 1
          fi
          echo "DOPPLER_TOKEN is set (${#DOPPLER_TOKEN} chars; value not printed)"
      - name: Verify the CLI can list projects with the minted token
        # Independent end-to-end check via the CLI surface: confirms the
        # token is acceptable to the CLI (not just to a raw curl call) and
        # that the identity has at least one project's read access.
        run: |
          set -euo pipefail
          if ! doppler projects --json | jq -e 'length > 0' >/dev/null; then
            echo "::error::doppler projects returned no projects for the readiness identity"
            exit 1
          fi
          echo "doppler-cli-oidc-auth verified: CLI lists projects with the minted token."

  gcp-wif-auth:
    # Implements: HHT-OPS-identity-over-keys/A
    #   End-to-end readiness check of the WIF handshake via the composite action.
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required by the WIF auth exchange
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Auth to GCP via gcp-wif-auth
        id: auth
        uses: ./.github/actions/gcp-wif-auth
        with:
          workload_identity_provider: ${{ vars.READINESS_WIF_PROVIDER }}
          service_account: ${{ vars.READINESS_WIF_SA }}
      - name: Verify the WIF token mint produced an access token
        env:
          # Pass the secret via env, never as an inline ${{ }} on the shell line.
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          # The composite action's access_token output is non-empty iff the
          # full WIF handshake succeeded (GitHub OIDC -> GCP STS exchange ->
          # SA impersonation -> access token mint). No CLI dependency: we
          # read the action's output directly. This keeps the test honest
          # about what the action does (configures ADC) without coupling to
          # whatever the runner image happens to preinstall.
          if [ -z "${TOKEN:-}" ] || [ "${#TOKEN}" -lt 20 ]; then
            echo "WIF token mint failed: access_token empty or too short (${#TOKEN} chars)"
            echo "ADC env vars (no values, names only):"
            if ! env | grep -oE "^(GOOGLE_|CLOUDSDK_)[A-Z_]+"; then
              echo "::warning::no GOOGLE_/CLOUDSDK_ env vars found (tolerated: informational dump only, script exits below regardless)"
            fi
            exit 1
          fi
          echo "WIF handshake verified: minted a ${#TOKEN}-char access token (value not printed)"

  release-notes-publish:
    # End-to-end smoke for the release-notes-publish composite action.
    # Seeds RELEASE_NOTES.md + a pending fragment, invokes the action,
    # asserts the step outputs match what we seeded.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Seed RELEASE_NOTES.md and a pending fragment
        run: |
          set -euo pipefail
          mkdir -p .release-notes
          cat > RELEASE_NOTES.md <<'EOF'
          # Release Notes

          ## v0.0.1+1 — 2026-05-13

          <!-- summary -->
          <!-- /summary -->

          <!-- entries -->
          - [CUR-1] seed entry
          <!-- /entries -->
          EOF
          cat > .release-notes/smoke.md <<'EOF'
          <!-- release-notes-fragment v1 -->
          <!-- version: v0.0.1+1 -->

          - [CUR-2] pending fragment
          EOF
      - id: notes
        uses: ./.github/actions/release-notes-publish
      - name: Verify outputs
        env:
          VERSION: ${{ steps.notes.outputs.version }}
          ENTRIES: ${{ steps.notes.outputs.entries_block }}
        run: |
          set -euo pipefail
          [ "$VERSION" = "v0.0.1+1" ] || { echo "::error::version mismatch: $VERSION"; exit 1; }
          echo "$ENTRIES" | grep -q '\[CUR-1\] seed entry' || { echo "::error::missing seed entry"; exit 1; }
          echo "$ENTRIES" | grep -q '\[CUR-2\] pending fragment' || { echo "::error::missing pending entry"; exit 1; }
          echo "release-notes-publish smoke OK"

  cosign-verify:
    # Implements: CAL-OPS-deploy-provenance-traceability  (callisto spec/ops-deployment.md)
    #   End-to-end readiness check of the cosign-verify composite action.
    #   Builds a minimal fixture image, pushes to GHCR, signs it with the
    #   workflow's own keyless OIDC identity, then verifies with the action.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write    # push to GHCR
      id-token: write    # keyless cosign sign (OIDC token)
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push fixture image
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75  # v6.9.0
        with:
          context: .github/fixtures/cosign-verify
          push: true
          tags: ghcr.io/cure-hht/cosign-verify-readiness:${{ github.sha }}

      - name: Install Cosign (for signing step)
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159  # v3.9.2

      - name: Sign fixture image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes \
            "ghcr.io/cure-hht/cosign-verify-readiness@${IMAGE_DIGEST}"

      - name: Verify signature via composite action (happy path)
        # soft-fail: 'false' so a verification failure blocks this readiness job.
        uses: ./.github/actions/cosign-verify
        with:
          images: ghcr.io/cure-hht/cosign-verify-readiness@${{ steps.build.outputs.digest }}
          soft-fail: 'false'

      - name: Verify signature fails for wrong identity (negative case)
        id: negative
        uses: ./.github/actions/cosign-verify
        with:
          images: ghcr.io/cure-hht/cosign-verify-readiness@${{ steps.build.outputs.digest }}
          identity-regexp: 'https://github.com/does-not-exist/wrong-repo'
          soft-fail: 'false'
        continue-on-error: true

      - name: Assert negative case failed
        env:
          OUTCOME: ${{ steps.negative.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::Expected wrong-identity check to fail but got outcome: ${OUTCOME}"
            exit 1
          fi
          echo "Negative identity check correctly rejected wrong-repo identity (outcome: ${OUTCOME})"

  build-urs:
    # End-to-end readiness check for the build-urs composite action: compiles
    # the self-contained synthetic URS fixture (a primary + an associate repo)
    # and asserts the PDF + DOCX deliverables are produced. Exercises
    # multi-source federation, level filtering, and metadata hiding.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize fixture repos
        # elspais resolves a project root via `git rev-parse --show-toplevel`.
        # Inside this checkout the fixture dirs resolve to the hht_workflows
        # root (no .elspais.toml there), so each fixture repo needs its own
        # git toplevel. No commit required.
        run: |
          git init -q scripts/urs-compile/test_compile_urs/fixtures/readiness/primary
          git init -q scripts/urs-compile/test_compile_urs/fixtures/readiness/associate
      - name: Compile the readiness fixture
        uses: ./.github/actions/build-urs
        with:
          elspais-version: "0.117.81"
          primary-root: scripts/urs-compile/test_compile_urs/fixtures/readiness/primary
          associate-roots: scripts/urs-compile/test_compile_urs/fixtures/readiness/associate
          manifest: spec/URS-manifest/urs.yaml
      - name: Assert deliverables exist and have fixture content
        run: |
          set -euo pipefail
          d=scripts/urs-compile/test_compile_urs/fixtures/readiness/primary
          test -s "$d/docs/urs.pdf"
          test -s "$d/docs/urs.docx"
          # Content assertions on the assembled markdown: sponsor REQ (scope
          # sponsor) and the by-level DEV REQ both rendered.
          grep -q "FIX-PRD-sponsor-config" "$d"/build/urs-assembled*.md
          grep -q "DIARY-DEV-sample-internal" "$d"/build/urs-assembled*.md
          echo "build-urs readiness OK: urs.pdf + urs.docx produced with expected content."

  confidential-terms-scan:
    # Implements: HHT-OPS-confidential-keywords-scrubbing/F,G,I
    #   End-to-end readiness of the scanner action. Uses test_terms
    #   (synthetic, cannot collide with real terms) because this public
    #   repo has no scan-* Doppler identity; the Doppler fetch path is
    #   the same secrets-fetch action already exercised by the
    #   doppler-oidc-auth readiness job.
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required by the gated Doppler-path step below
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Happy path - synthetic term absent from this PR
        uses: ./.github/actions/confidential-terms-scan
        with:
          test_terms: 'zzyzx-readiness-fixture-term'
          base_ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          head_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Negative path - every surface trips in a fixture repo, nothing echoed
        env:
          REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          git -C "$fixture" init -q -b main
          git -C "$fixture" -c user.email=t@example.invalid -c user.name=t \
            commit -q --allow-empty -m base
          base="$(git -C "$fixture" rev-parse HEAD)"
          mkdir -p "$fixture/zebra-fixture-dir"
          # Basename hit -> 'filename'; clean basename under a matching
          # dir -> 'path-segment' (scan_paths classifies by basename first).
          printf 'contains zebra-fixture-term here\n' > "$fixture/zebra-fixture-file.md"
          printf 'clean content\n' > "$fixture/zebra-fixture-dir/clean.md"
          git -C "$fixture" add .
          git -C "$fixture" -c user.email=t@example.invalid -c user.name=t \
            commit -qm fixture
          set +e
          out="$(cd "$fixture" && \
            CONFIDENTIAL_PROHIBIT_LIST='zebra-fixture-term,zebra-fixture-dir,zebra-fixture-file.md' \
            BRANCH_NAME='feat/zebra-fixture-term' \
            PR_TITLE='add zebra-fixture-term' \
            PYTHONPATH="$REPO_ROOT/hooks/confidential-terms-scan" \
            python3 -m confidential_terms_scan --from-ref "$base" 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "::error::expected exit 1 from the fixture scan, got $rc"
            exit 1
          fi
          for surface in content filename path-segment metadata; do
            if ! grep -q "$surface" <<<"$out"; then
              echo "::error::surface '$surface' did not trip"
              exit 1
            fi
          done
          if grep -qi 'zebra' <<<"$out"; then
            echo "::error::scan output echoed matched text"
            exit 1
          fi
          echo "All four surfaces trip; no matched text in output."
      - name: Doppler path - inlined fetch feeds the scan (gated)
        # Gated off by default. The question this step was written for -
        # does a fetch reach the scan step? - is resolved: action.yml fetches
        # CONFIDENTIAL_PROHIBIT_LIST inline via dopplerhq/secrets-fetch-action
        # (action.yml L77-80, no nested composite), and the confidential-terms-gate
        # job below plus the consumer gates (hht_diary et al.) exercise that
        # path live against real scan-* projects. Turning this on adds value
        # only against a dedicated synthetic fixture project - never admin/prod,
        # which holds real secrets - so it stays gated behind an operator who
        # has (1) added a synthetic CONFIDENTIAL_PROHIBIT_LIST secret to a
        # fixture Doppler project and (2) set READINESS_SCAN_DOPPLER_READY=true.
        if: vars.READINESS_SCAN_DOPPLER_READY == 'true'
        uses: ./.github/actions/confidential-terms-scan
        with:
          doppler_identity_id: ${{ vars.READINESS_DOPPLER_IDENTITY_ID }}
          doppler_project: ${{ vars.READINESS_DOPPLER_PROJECT }}
          doppler_config: ${{ vars.READINESS_DOPPLER_CONFIG }}
          base_ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          head_ref: ${{ github.event.pull_request.head.sha || github.sha }}

  confidential-terms-gate:
    # Implements: HHT-OPS-confidential-keywords-scrubbing/H,I
    #   The REAL confidential-terms gate for this repo (assertion I): scans
    #   the PR range against the live scan-hht-workflows Doppler prohibit list,
    #   dogfooding the action the same way consumers invoke it. Distinct from
    #   the confidential-terms-scan readiness job above, which is fixture-only
    #   (test_terms, no Doppler identity) and whose bare id is therefore taken;
    #   Phase 6's per-repo ruleset requires THIS job's bare id
    #   `confidential-terms-gate` (no `name:` override, so the reported
    #   check-run name equals the job id).
    #
    # D7 (public repo): fork PRs have no OIDC token, so the Doppler fetch
    # cannot run on them. The guard skips fork PRs - reported `skipped`, which
    # both validation-summary and a required-check rule accept - while
    # same-repo PRs and pushes to the default branch always run. `push` is
    # kept in the condition so the required check still resolves on `main`.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required by the Doppler OIDC fetch inside the action
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the scan diffs base..head
      - name: Scan four surfaces for confidential terms
        uses: ./.github/actions/confidential-terms-scan
        with:
          doppler_identity_id: ${{ vars.CONFIDENTIAL_SCAN_DOPPLER_IDENTITY_ID }}
          doppler_project: scan-hht-workflows
          base_ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          head_ref: ${{ github.event.pull_request.head.sha || github.sha }}

  no-op:
    # Placeholder job; per-action readiness jobs added by PRs that introduce
    # each action. Keeps the workflow non-empty until all real jobs land.
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "Readiness Checks workflow ready; per-action jobs land in subsequent PRs."
