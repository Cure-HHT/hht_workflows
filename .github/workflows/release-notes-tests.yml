# Release Notes Tests — runs pytest against the hook + publish action.
# Required check; runs on every PR + on push to main.

name: Release Notes Tests

on:
  # No paths filter on pull_request: this is a REQUIRED check (classic
  # protection today, the hht_admin ruleset next), and a paths-filtered
  # required check wedges any PR that does not touch a matching file at
  # "Expected" forever. The suite is cheap; run it on every PR.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'hooks/release-notes-update/**'
      - 'hooks/no-or-true-guard/**'
      - 'hooks/confidential-terms-scan/**'
      - 'hooks/download-integrity/**'
      - '.github/actions/install-doppler-cli/**'
      - '.github/actions/install-gitleaks/**'
      - '.github/actions/release-notes-publish/**'
      - '.github/actions/sponsor-base-preflight/**'
      - '.github/actions/elspais-federate/**'
      - '.github/actions/obtain-upstream/**'
      - '.github/actions/gcp-wif-auth/**'
      - '.github/actions/build-urs/**'
      - '.github/actions/cosign-verify/**'
      # cloud-run-resolve-serving-digest was added with a test suite but never
      # added here, so a post-merge change to the action ran no tests on main.
      - '.github/actions/cloud-run-resolve-serving-digest/**'
      - '.github/actions/cloud-run-deploy-no-traffic/**'
      - '.github/workflows/promote-template.yml'
      - '.github/workflows/deploy-cloud-run.yml'
      - '.github/workflows/reset-db.yml'
      - '.github/workflows/archive-deployment-logs.yml'
      - '.github/workflows/archive-build-artifacts.yml'
      # The urs-compile suite had no CI runner at all: a pre-existing
      # failure sat unnoticed because nothing ever executed it.
      - 'scripts/urs-compile/**'
      - 'scripts/oq-compile/**'
      # The pipeline mechanism: the wrapper, the ledger and the refusal
      # program. Added WITH the suite rather than after it, because the
      # comment two entries up records what happens otherwise.
      - 'pipeline/**'
      - 'Dockerfile.pipeline'
      - 'scripts/pipeline/**'
      - 'tests/**'
      - 'bootstrap/**'
      - 'pyproject.toml'
      - '.pre-commit-hooks.yaml'
      - '.github/workflows/release-notes-tests.yml'

concurrency:
  group: release-notes-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Release Notes Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install hooks package with test deps
        run: |
          set -euo pipefail
          pip install --quiet -e '.[test]'
      - name: Run hook tests
        run: |
          set -euo pipefail
          pytest hooks/release-notes-update/tests/ -v
      - name: Run no-or-true-guard tests
        run: |
          set -euo pipefail
          pytest hooks/no-or-true-guard/tests/ -v
      - name: Run confidential-terms-scan tests
        run: |
          set -euo pipefail
          pytest hooks/confidential-terms-scan/tests/ -v
      # Verifies: HHT-OPS-ci-tool-download-integrity/C
      - name: Run download-integrity tests
        run: |
          set -euo pipefail
          pytest hooks/download-integrity/tests/ -v
      - name: Run publish action tests
        run: |
          set -euo pipefail
          cd .github/actions/release-notes-publish
          PYTHONPATH=.:../../../hooks/release-notes-update pytest tests/ -v
      # CUR-1668. This workflow is the repo's whole Python suite despite its
      # name; it is a required check, and renaming a required check wedges
      # every open PR, so new suites are added as steps here rather than as a
      # new workflow.
      - name: Run sponsor-base-preflight tests
        run: |
          set -euo pipefail
          cd .github/actions/sponsor-base-preflight
          PYTHONPATH=. pytest tests/ -v
      - name: Run elspais-federate tests
        run: |
          set -euo pipefail
          cd .github/actions/elspais-federate
          PYTHONPATH=. pytest tests/ -v
      - name: Run obtain-upstream tests
        run: |
          set -euo pipefail
          cd .github/actions/obtain-upstream
          PYTHONPATH=. pytest tests/ -v
      - name: Run gcp-wif-auth workspace-credential guard tests
        run: |
          set -euo pipefail
          cd .github/actions/gcp-wif-auth
          PYTHONPATH=. pytest tests/ -v
      - name: Run build-urs obtain-associates tests
        run: |
          set -euo pipefail
          cd .github/actions/build-urs
          pytest tests/ -v
      - name: Run published-tree completeness tests
        run: |
          set -euo pipefail
          pytest scripts/publish/tests/ -v
      - name: Run bootstrap guard tests
        run: |
          set -euo pipefail
          pytest bootstrap/tests/ -v
      - name: Run cosign-verify logic tests
        run: |
          set -euo pipefail
          pytest .github/actions/cosign-verify/tests/ -v
      - name: Run cloud-run-resolve-serving-digest logic tests
        run: |
          set -euo pipefail
          pytest .github/actions/cloud-run-resolve-serving-digest/tests/ -v
      - name: Run cloud-run-deploy-no-traffic flag tests
        run: |
          set -euo pipefail
          pytest .github/actions/cloud-run-deploy-no-traffic/tests/ -v
      # Verifies: HSI-OPS-promotion-gate-qa/D. The source-health gate refuses on
      # states a live project will not produce on demand — a healthy service
      # cannot be asked to report `degraded` just to watch the refusal.
      - name: Run promote-template source-health tests
        run: |
          set -euo pipefail
          pytest tests/test_promote_template.py -v
      # The deploy's identity read and environment cross-check refuse on
      # states a live run should never reach: another sponsor's identity, an
      # undeclared environment, or variables naming another environment.
      - name: Run deploy-cloud-run identity tests
        run: |
          set -euo pipefail
          pytest tests/test_deploy_cloud_run.py -v
      # The reset's production refusal, typed confirmation and environment
      # cross-check, and the archives' refusal to write a record that cannot
      # say what it records.
      - name: Run reset-db and archive workflow tests
        run: |
          set -euo pipefail
          pytest tests/test_reset_db.py tests/test_archive_workflows.py -v
      # The refusal program the pipeline image carries. Its load-bearing case is
      # that an ABSENT verdict refuses: a missing result means the step never
      # ran, and reading that as a pass is how a gate reports success for work
      # that never happened.
      - name: Run pipeline refuse tests
        run: |
          set -euo pipefail
          pytest pipeline/tests/ -v
      # pandoc pinned to the same release the build-urs action installs: the
      # docx reference builder seeds from pandoc's default data file, so an
      # unpinned pandoc makes these assertions track the runner image.
      # Implements: HHT-OPS-ci-tool-download-integrity/A+B
      - name: Install pandoc + urs-compile test deps
        run: |
          set -euo pipefail
          # Read the pin and its digest from the build-urs action's defaults so
          # this job and the action can never disagree about which pandoc they
          # mean, or about which bytes that is.
          PANDOC_VERSION="$(python3 -c "import yaml;print(yaml.safe_load(open('.github/actions/build-urs/action.yml'))['inputs']['pandoc-version']['default'])")"
          PANDOC_SHA256="$(python3 -c "import yaml;print(yaml.safe_load(open('.github/actions/build-urs/action.yml'))['inputs']['pandoc-sha256']['default'])")"
          echo "pinned pandoc: ${PANDOC_VERSION}"
          deb="$(mktemp --suffix=.deb)"
          curl -fsSL -o "$deb" \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          if ! echo "${PANDOC_SHA256}  ${deb}" | sha256sum -c -; then
            echo "::error::pandoc-${PANDOC_VERSION}-1-amd64.deb does not match build-urs's pandoc-sha256; refusing to install it" >&2
            exit 1
          fi
          sudo dpkg -i "$deb"
          rm -f "$deb"
          installed="$(pandoc --version | head -1 | awk '{print $2}')"
          if [ "$installed" != "${PANDOC_VERSION}" ]; then
            echo "::error::pandoc ${installed} installed, expected ${PANDOC_VERSION}" >&2
            exit 1
          fi
          pip install --quiet -r scripts/urs-compile/requirements-compile.txt lxml
      - name: Run urs-compile tests
        run: |
          set -euo pipefail
          pytest scripts/urs-compile/test_compile_urs/ -v

  oq-compile-tests:
    name: oq-compile tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --quiet -r scripts/oq-compile/requirements-oq.txt
      - name: Run oq-compile tests
        run: |
          set -euo pipefail
          pytest scripts/oq-compile/test_oq_compile/ -v

  # Implements: HHT-OPS-failure-notification-routing/A
  #   The standard job, verbatim — notify-failure-lint checks it literally.
  notify-failure:
    name: Notify failure
    needs: [test, oq-compile-tests]
    if: ${{ !cancelled() && contains(needs.*.result, 'failure') && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: Cure-HHT/hht_workflows/.github/actions/notify-failure@4a7ad15496d2368acd0da1a3d6dd44b8a645ea5b  # v1.9.0
        with:
          slack-token: ${{ secrets.SLACK_APP_OATH_TOKEN }}
