# no-or-true-guard — emits a check named exactly "no-or-true-guard" so it's
# discoverable by the Validation Summary aggregate.
#
# This is hht_workflows's own consumption of the canonical composite action
# at .github/actions/no-or-true-guard-check/ (CI-side counterpart to the
# local pre-commit dogfooding already configured in .pre-commit-config.yaml).
# Other Cure-HHT repos consume the same logic by
# `uses: Cure-HHT/hht_workflows/.github/actions/no-or-true-guard-check@<ref>`.
#
# Only this repo's own wrapper needs the "Install this repo" step below:
# the no-or-true-guard hook here is `repo: local` + `language: system`
# (see .pre-commit-config.yaml for why), which execs whatever's already on
# PATH rather than installing anything itself — same reason tools/setup-repo.sh
# does this for local dev. Consumer repos reference no-or-true-guard via
# the HOSTED repo (`repo: https://github.com/Cure-HHT/hht_workflows`),
# which pre-commit installs correctly on its own; they don't need this step.

name: no-or-true-guard

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: no-or-true-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: no-or-true-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4  # required for ./.github/actions resolution
      - name: Install this repo (for the local no-or-true-guard hook's PATH resolution)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user .
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/no-or-true-guard-check

  # Implements: HHT-OPS-failure-notification-routing/A
  #   The standard job, verbatim — notify-failure-lint checks it literally.
  #   `name:` is set so this reports as "Notify failure" and does not collide
  #   with any other check context.
  notify-failure:
    name: Notify failure
    needs: [check]
    if: ${{ !cancelled() && contains(needs.*.result, 'failure') && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: Cure-HHT/hht_workflows/.github/actions/notify-failure@f87a71fffa22779dc045197e145c480435ae659e  # v1.13.0
        with:
          slack-token: ${{ secrets.SLACK_APP_OATH_TOKEN }}
