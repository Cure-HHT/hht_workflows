# Smoke-test routing file for the slack-notify composite action.
#
# Used ONLY by .github/workflows/slack-notify-smoke.yml — it is not a
# real consumer routing file. The smoke workflow passes this path via
# the action's `routing-file` input so it can exercise the action's
# routing -> conversations.list -> post -> bookmark path end-to-end
# without polluting any real channel.
#
# Channel: #dev (per CUR-1339 smoke). Bot needs membership; the action
# self-joins public channels so no manual /invite is needed.

channels:
  SMOKE_TEST_CH: "#dev"

routing:
  smoke-test: SMOKE_TEST_CH
