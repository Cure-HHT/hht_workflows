# Pre-commit hooks for cure-hht/hht_workflows.
#
# This repo is the canonical home for shared Cure-HHT-specific hooks
# (the `hooks/` directory; currently empty pending the first cross-cutting
# hook). Other Cure-HHT repos pull their hook list from a mix of public
# pre-commit-hooks repos and (in time) `hooks/` here.
#
# Setup:
#   scripts/setup.sh      # configures core.hooksPath and warms cache
#
# Manual run:
#   pre-commit run --all-files

default_stages: [pre-commit]

repos:
  # Universal hygiene — formatting + obvious-foot-gun guards.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]

  # Secret scanning — same gitleaks version pinned in
  # .github/actions/secrets-scan/action.yml. Runs at both pre-commit
  # (catch secrets while editing) and pre-push (last line of defence
  # before they reach a remote, including for force-pushes that
  # bypass per-commit hooks).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.29.0
    hooks:
      - id: gitleaks
        stages: [pre-commit, pre-push]

  # Markdown linting — keep README and docs consistent.
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        args: [--ignore, .github/]

  # GitHub Actions YAML validation — catches workflow syntax errors,
  # bad expressions, missing inputs, etc. before push.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  # Dogfood our own no-or-true-guard hook (hooks/no-or-true-guard/README.md).
  # language: system, not python: for `repo: local`, pre-commit builds
  # language: python environments inside its OWN cache directory using a
  # synthetic placeholder package — `additional_dependencies: ["."]` was
  # tried here and resolves "." against that placeholder, not this repo,
  # silently installing an empty package with no entry point (reproduced
  # in a clean container; see CUR-1640 PR #36). language: system instead
  # execs whatever `no-or-true-guard` resolves to on PATH; scripts/setup.sh
  # installs this repo (`pip install --user -e .`) so that resolves
  # correctly on a fresh clone.
  - repo: local
    hooks:
      - id: no-or-true-guard
        name: no-or-true-guard
        entry: no-or-true-guard
        language: system
        types_or: [shell, yaml, dockerfile, makefile]
