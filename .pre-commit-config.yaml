# Pre-commit hooks for cure-hht/hht_workflows.
#
# This repo is the canonical home for shared Cure-HHT-specific hooks
# (the `hooks/` directory: release-notes-update, no-or-true-guard, and
# confidential-terms-scan). Other Cure-HHT repos pull their hook list from
# a mix of public pre-commit-hooks repos and `hooks/` here.
#
# Setup:
#   tools/setup-repo.sh      # configures core.hooksPath and warms cache
#
# Manual run:
#   pre-commit run --all-files

# Install both hook types on `pre-commit install`: pre-commit hooks run at
# commit time, and the pre-push stage (gitleaks, confidential-terms-scan)
# runs at push time. tools/setup-repo.sh drives `core.hooksPath = .githooks`,
# whose pre-commit + pre-push wrappers cover both stages regardless.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # Universal hygiene — formatting + obvious-foot-gun guards.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]

  # Secret scanning — same gitleaks version pinned in
  # .github/actions/secrets-scan/action.yml. Runs at both pre-commit
  # (catch secrets while editing) and pre-push (last line of defence
  # before they reach a remote, including for force-pushes that
  # bypass per-commit hooks).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.29.0
    hooks:
      - id: gitleaks
        stages: [pre-commit, pre-push]

  # Markdown linting — keep README and docs consistent.
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        args: [--ignore, .github/]

  # GitHub Actions YAML validation — catches workflow syntax errors,
  # bad expressions, missing inputs, etc. before push.
  # v1.7.12+ is required: v1.7.7 hard-codes GitHub's superseded 10-input cap
  # on workflow_dispatch and rejects conforming workflows that exceed it.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Dogfood our own no-or-true-guard hook (hooks/no-or-true-guard/README.md).
  # language: system, not python: for `repo: local`, pre-commit builds
  # language: python environments inside its OWN cache directory using a
  # synthetic placeholder package — `additional_dependencies: ["."]` was
  # tried here and resolves "." against that placeholder, not this repo,
  # silently installing an empty package with no entry point (reproduced
  # in a clean container; see CUR-1640 PR #36). language: system instead
  # execs whatever `no-or-true-guard` resolves to on PATH; tools/setup-repo.sh
  # installs this repo (`pip install --user -e .`) so that resolves
  # correctly on a fresh clone.
  - repo: local
    hooks:
      - id: no-or-true-guard
        name: no-or-true-guard
        entry: no-or-true-guard
        language: system
        types_or: [shell, yaml, dockerfile, makefile]

      # Dogfood our own confidential-terms-scan hook at pre-push
      # (hooks/confidential-terms-scan/README.md). Same `repo: local` +
      # `language: system` rationale as no-or-true-guard above: for
      # `repo: local`, pre-commit builds `language: python` environments in
      # its OWN cache using a synthetic placeholder package, so
      # `additional_dependencies: ["."]` installs that empty placeholder
      # (no entry point), not this repo. `language: system` execs whatever
      # `confidential-terms-scan` resolves to on PATH; tools/setup-repo.sh
      # installs this repo (`pip install --user -e .`) so the console script
      # resolves on a fresh clone. The hosted manifest (.pre-commit-hooks.yaml)
      # keeps `language: python` — consumers clone this repo and `pip install`
      # it, which resolves the console script correctly there.
      # Implements: HHT-OPS-confidential-keywords-scrubbing/H,I
      - id: confidential-terms-scan
        name: confidential-terms-scan
        entry: confidential-terms-scan
        # --on-fetch-error=warn: this public repo has no scan-hht-workflows
        # Doppler project provisioned for developer CLIs yet, and fork
        # contributors never will — a fetch failure degrades to a loud
        # warning locally rather than blocking the push. PR CI
        # (readiness-checks.yml `confidential-terms-gate`) is the
        # authoritative gate, fetching via OIDC.
        args: [--doppler-project=scan-hht-workflows, --on-fetch-error=warn]
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
