# elspais configuration — Readiness Fixture Sponsor (primary)
#
# Holds FIX-* sponsor requirements consumed by the sponsor chapter of the
# readiness fixture URS. Mirrors the structure of hht_diary_callisto.

version = 4

[project]
namespace = "FIX"
name = "Fixture Sponsor"

[id-patterns]
canonical = "{namespace}-{level.letter}-{component}"
separators = ["-"]
prefix_optional = false

[id-patterns.component]
style = "kebab-case"

[levels.PRD]
rank = 1
letter = "PRD"
display_name = "Product"
implements = ["PRD"]

[levels.GUI]
rank = 3
letter = "GUI"
display_name = "Interface"
implements = ["GUI", "PRD"]

[levels.DEV]
rank = 5
letter = "DEV"
display_name = "Development"
implements = ["DEV", "GUI", "PRD"]

[scanning.spec]
directories = ["spec"]
file_patterns = ["*.md"]
skip_dirs = ["URS-manifest", "_generated"]

[rules.format]
require_hash = false
require_status = true

[validation]
hash_mode = "normalized-text"
hash_algorithm = "sha256"
hash_length = 8

[associates]
