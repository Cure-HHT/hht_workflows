# tools/urs-section-map.yaml
#
# Maps spec files to URS chapter/section structure. Drives compile-urs.py.
#
# The compile pipeline reads `elspais graph` JSON (run from the sponsor
# side to capture the federated graph) and emits content for each section
# by collecting REQs whose source_file matches `files` below — across both
# repos. Within a section, REQs keep source order, with PRD/GUI twins
# sharing one kebab name merged into a single level-3 section (see
# urs_compile/ordering.py); only PRD and GUI levels appear in the URS
# deliverable.
#
# Chapter `scope` controls namespace routing: `core` chapters emit DIARY-*
# REQs only; the `sponsor` chapter collects every sponsor-namespace REQ
# from the files it references. Sponsor REQs are no longer interleaved
# with core REQs.
#
# Structural notes (mirroring the URS-v1 source document, 2026-06-10):
#   - The former "5.2 User Interface" gap is gone — URS-v1 numbers the
#     portal sections 5.1-5.5 contiguously.
#   - URS-v1 4.4 "Questionnaire Score Display" is sponsor-only content;
#     with sponsor REQs collected into their own chapter the section has
#     no core REQs left, so chapter 4 renumbers contiguously and the REQ
#     surfaces in the sponsor chapter instead.

document:
  title: "User Requirements Specification"
  subtitle: "Diary Platform"
  sponsor: "Cure HHT"
  protocol: "Diary Platform"
  version: "1.0"
  status: "Draft"

# Authored prose pieces live under spec/URS-manifest/ — the URS document
# is authored content, even though the rendering pipeline (compile-urs.py,
# Lua filters, LaTeX template) is tooling. Spec authors edit the prose;
# tooling devs edit the scripts.
frontmatter: spec/URS-manifest/frontmatter.md
appendices:  spec/URS-manifest/appendices.md
# Glossary and term-index are regenerated fresh on every compile from
# the sponsor worktree (which declares the platform repo as an associate),
# so the federated view includes every defined term across all repos. The
# committed spec/_generated/ files are local-only and would miss sponsor
# terms — we read from build/_generated/ instead. See compile-urs.sh
# for the regeneration step.
glossary:    build/_generated/glossary.md
# Prune glossary + references entries whose term is not referenced in the
# assembled body (frontmatter + chapters + appendices). The federated
# glossary carries every defined term across all repos, including
# core-glossary and DEV/OPS-only vocabulary not used in this PRD/GUI
# deliverable. See prune_glossary_terms in compile-urs.py. Set to false
# to emit the full federated glossary.
prune_glossary: true
# Term index excluded from the URS PDF — the federated index is ~10.6k
# lines (one entry per indexed term, listing every assertion and code
# reference verbatim) and adds ~200 pages without proportional review
# value. Pending an elspais compression pass (see FEATURE_REQUEST #8)
# that collapses multiple assertions of one REQ into 'REQ-id-E/H/I'
# form and groups file references by directory.
# term_index:  build/_generated/term-index.md

chapters:
  - number: 4
    title: "SYSTEM-WIDE STANDARDS"
    intro_file: spec/URS-manifest/ch4-intro.md
    sections:
      - number: "4.1"
        title: "Common User Interface Elements and Actions"
        files: [spec/prd-common-ui.md]
      - number: "4.2"
        title: "Status Registry"
        files: [spec/prd-status-registry.md]
      - number: "4.3"
        title: "User Roles and Permissions"
        files: [spec/prd-rbac.md]
      # URS-v1 4.4 "Questionnaire Score Display" is sponsor-only
      # (spec/prd-questionnaire-score-display.md); it surfaces in the
      # sponsor chapter below. Subsequent sections renumber contiguously.
      - number: "4.4"
        title: "Audit Log Visibility"
        files: [spec/prd-audit-log.md]
      - number: "4.5"
        title: "Notification Behavior"
        files: [spec/prd-notification-behavior.md]
      - number: "4.6"
        title: "Help and Resources"
        files: [spec/prd-help-resources.md]
      - number: "4.7"
        title: "Configuration"
        files: [spec/prd-configuration.md]

  - number: 5
    title: "SPONSOR PORTAL REQUIREMENTS"
    intro_file: spec/URS-manifest/ch5-intro.md
    sections:
      - number: "5.1"
        title: "Administration"
        files: [spec/prd-user-account.md]
      - number: "5.2"
        title: "Questionnaire Management"
        files: [spec/prd-questionnaire-management.md]
      - number: "5.3"
        title: "Participant Workflows"
        files: [spec/prd-participant.md]
      - number: "5.4"
        title: "Sponsor Portal Authentication"
        files: [spec/prd-portal-auth.md]
      - number: "5.5"
        title: "Administrator Settings"
        files: [spec/prd-administrator-settings.md]

  - number: 6
    title: "MOBILE APPLICATION"
    intro_file: spec/URS-manifest/ch6-intro.md
    sections:
      - number: "6.1"
        title: "Mobile Application Foundation"
        files: [spec/prd-mobile-app.md]
      - number: "6.2"
        title: "Questionnaires Overview"
        files: [spec/prd-questionnaire-overview.md]
      - number: "6.3"
        title: "Participant Questionnaire Workflow"
        files: [spec/prd-questionnaire-participant-workflow.md]
      - number: "6.4"
        title: "Daily eDiary: HHT Epistaxis Data Capture"
        files: [spec/prd-epistaxis.md]
      - number: "6.5"
        title: "Score Calculation"
        files: [spec/prd-score-calculation.md]
      - number: "6.6"
        title: "Diary Entry Rules"
        files: [spec/prd-diary-entry-rules.md]
      - number: "6.7"
        title: "Mobile Application Navigation and Screens"
        files: [spec/prd-mobile-navigation.md]
      - number: "6.8"
        title: "Participant Tasks and Notifications"
        files: [spec/prd-mobile-notifications.md]
      - number: "6.9"
        title: "Device Linking"
        files: [spec/prd-device-linking.md]

  # Sponsor Configuration Requirements: every sponsor-namespace REQ from
  # the files above (plus sponsor-only files), collected into one chapter
  # instead of interleaving with the core REQs. Sections mirror the body
  # chapters so a reader can navigate from a Platform Requirement to the
  # sponsor configuration that refines it (the Refines: line on each REQ
  # carries the precise link).
  - number: 7
    title: "SPONSOR CONFIGURATION REQUIREMENTS"
    intro_file: spec/URS-manifest/ch7-intro.md
    scope: sponsor
    sections:
      - number: "7.1"
        title: "System-wide Standards"
        files:
          - spec/prd-common-ui.md
          - spec/prd-status-registry.md
          - spec/prd-rbac.md
          - spec/prd-questionnaire-score-display.md
          - spec/prd-audit-log.md
          - spec/prd-notification-behavior.md
          - spec/prd-help-resources.md
          - spec/prd-configuration.md
      - number: "7.2"
        title: "Sponsor Portal"
        files:
          - spec/prd-user-account.md
          - spec/prd-questionnaire-management.md
          - spec/prd-participant.md
          - spec/prd-portal-auth.md
          - spec/prd-administrator-settings.md
      - number: "7.3"
        title: "Mobile Application"
        files:
          - spec/prd-mobile-app.md
          - spec/prd-questionnaire-overview.md
          - spec/prd-questionnaire-participant-workflow.md
          - spec/prd-epistaxis.md
          - spec/prd-score-calculation.md
          - spec/prd-diary-entry-rules.md
          - spec/prd-mobile-navigation.md
          - spec/prd-mobile-notifications.md
          - spec/prd-device-linking.md
